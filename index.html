solid #d6e7db;background:#eff8f1;color:#4f8069;border-radius:8px;padding:5px 8px;font-size:9px;font-weight:800;white-space:nowrap}.reminder-project{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:7px}.filter-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:15px}.filter-chip{border:1px solid var(--line);border-radius:10px;background:#fffefa;color:#6c8081;padding:8px 11px;font-size:10px;font-weight:800}.filter-chip.active{background:var(--navy);border-color:var(--navy);color:#fff}.filter-bar select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fffefa;color:var(--ink);font-size:10px;max-width:100%}.empty-mini{border:1px dashed #d6e2d8;border-radius:14px;padding:19px 16px;text-align:center;color:var(--muted);font-size:10px;line-height:1.9;background:rgba(255,254,250,.58)}.empty-mini strong{display:block;color:var(--navy);font-size:12px;margin-bottom:4px}.project-color-swatches{display:flex;gap:8px;flex-wrap:wrap}.project-color-option{position:relative}.project-color-option input{position:absolute;opacity:0;pointer-events:none}.project-color-option span{width:28px;height:28px;display:block;border-radius:9px;border:2px solid transparent;cursor:pointer}.project-color-option input:checked+span{outline:2px solid var(--navy);outline-offset:2px}.date-badge{font-size:9px;font-weight:800;color:#759088;background:#edf6ef;padding:4px 7px;border-radius:7px}.date-badge.overdue{color:#a94a55;background:#fff0f1}.reminder-row{grid-template-columns:31px minmax(0,1fr) auto}.reminder-info{min-width:0}.reminder-info strong{overflow-wrap:anywhere}.reminder-info small{line-height:1.8}

<div class="shell">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">符</div><div><div class="brand-name">符冬便利店</div><div class="brand-sub">FUDONG · LOCAL WORKSPACE</div></div></div>
    <div><div class="nav-kicker">MY SPACE</div><nav class="nav" id="mainNav">
      <button class="active" data-view="home"><span class="nav-icon">⌂</span>工作台总览</button>
      <button data-view="projects"><span class="nav-icon">▦</span>项目分类</button>

  <main class="main">
    <div class="topbar"><div class="breadcrumb"><span>符冬便利店</span><span>／</span><strong id="breadcrumbCurrent">本地初始化</strong></div><div class="top-actions"><div class="top-pill"><span class="save-dot"></span>浏览器本地保存</div><button class="user-switch" id="userSwitch" type="button"><span class="user-avatar">＋</span><span id="userSwitchText">创建本地用户</span>⌄</button></div></div>
    <div id="appView" aria-live="polite"><section class="empty-stage" style="min-height:320px"><div class="empty-content"><div class="empty-icon">⌁</div><h3>正在打开你的本地工作台</h3><p>正在读取这个浏览器中保存的资料，请稍等片刻。</p></div></section></div>
    <div class="footnote"><span>符冬便利店 · 个人本地工作台</span><span>无后端 · IndexedDB 自动保存 · 建议定期导出 JSON 备份</span></div>

<div class="overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal" id="modalContent"></div></div>

<script>
(()=>{
'use strict';
const DB_NAME='fudong_store_workbench_v1';
const DB_VERSION=3;
const ACTIVE_USER_KEY='fudong-store-active-user-v1';
const $=id=>document.getElementById(id);
const state={db:null,users:[],activeUser:null,projects:[],templates:[],records:[],reminders:[],settings:null,backups:[],view:'home',toastTimer:null,editingProjectId:null,editingReminderId:null,backupTimer:null,backupBusy:false,selectedProjectId:null,reminderFilter:'active',calendarCursor:new Date(new Date().getFullYear(),new Date().getMonth(),1),selectedDate:localDate()};
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=prefix=>`${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,10)}`;
function getRememberedUserId(){try{return localStorage.getItem(ACTIVE_USER_KEY)}catch{return null}}
function rememberUserId(id){try{localStorage.setItem(ACTIVE_USER_KEY,id)}catch{/* Local business data still persists in IndexedDB. */}}
function localDate(date=new Date()){return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`}
const fmtDate=value=>{if(!value)return '未设置日期';const d=new Date(value);return Number.isNaN(d.getTime())?String(value):new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'short',day:'numeric'}).format(d)};
function fmtDateTime(value){if(!value)return '未设置时间';const d=new Date(value);if(Number.isNaN(d.getTime()))return String(value);return new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(d)}
function toLocalDateTimeValue(value){if(!value)return '';const d=new Date(value);if(Number.isNaN(d.getTime()))return '';const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>el.classList.remove('show'),2800)}
function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window)){reject(new Error('当前浏览器不支持 IndexedDB'));return}const request=indexedDB.open(DB_NAME,DB_VERSION);request.onupgradeneeded=()=>{const db=request.result;const transaction=request.transaction;const ensure=(name,keyPath,indexes=[])=>{const store=db.objectStoreNames.contains(name)?transaction.objectStore(name):db.createObjectStore(name,{keyPath});for(const [indexName,path] of indexes)if(!store.indexNames.contains(indexName))store.createIndex(indexName,path,{unique:false})};ensure('users','id',[['createdAt','createdAt']]);ensure('projects','id',[['userId','userId'],['status','status'],['updatedAt','updatedAt']]);ensure('templates','id',[['userId','userId'],['updatedAt','updatedAt']]);ensure('records','id',[['userId','userId'],['templateId','templateId'],['updatedAt','updatedAt']]);ensure('reminders','id',[['userId','userId'],['dueAt','dueAt'],['updatedAt','updatedAt'],['projectId','projectId']]);ensure('settings','userId');ensure('backups','id',[['userId','userId'],['createdAt','createdAt']])};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error||new Error('无法打开本地数据库'));request.onblocked=()=>reject(new Error('本地数据库正在被另一个页面占用，请关闭其他工作台标签后重试'))})}
function tx(storeNames,mode,executor){return new Promise((resolve,reject)=>{const transaction=state.db.transaction(storeNames,mode);let result;try{result=executor(transaction)}catch(error){reject(error);return}transaction.oncomplete=()=>resolve(result);transaction.onerror=()=>reject(transaction.error||new Error('本地数据写入失败'));transaction.onabort=()=>reject(transaction.error||new Error('本地事务已取消'))})}
function req(request){return new Promise((resolve,reject)=>{request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error||new Error('本地数据读取失败'))})}
async function allFrom(name){return req(state.db.transaction([name],'readonly').objectStore(name).getAll())}
async function put(name,value){await tx([name],'readwrite',t=>t.objectStore(name).put(value))}
async function remove(name,id){await tx([name],'readwrite',t=>t.objectStore(name).delete(id))}
async function reloadUsers(){state.users=(await allFrom('users')).sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''))}
async function reloadWorkspace(){if(!state.activeUser){state.projects=[];state.templates=[];state.records=[];state.reminders=[];state.settings=null;state.backups=[];return}const userId=state.activeUser.id;const [projects,templates,records,reminders,settings,backups]=await Promise.all([allFrom('projects'),allFrom('templates'),allFrom('records'),allFrom('reminders'),req(state.db.transaction(['settings'],'readonly').objectStore('settings').get(userId)),allFrom('backups')]);state.projects=projects.filter(x=>x.userId===userId).sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));state.templates=templates.filter(x=>x.userId===userId);state.records=records.filter(x=>x.userId===userId);state.reminders=reminders.filter(x=>x.userId===userId).sort((a,b)=>{if(a.status!==b.status)return a.status==='done'?1:-1;return (a.dueAt||'9999').localeCompare(b.dueAt||'9999')});state.settings=settings||{userId,autoBackupIntervalMs:0,lastBackupAt:null,autoBackupStartedAt:null};state.backups=backups.filter(x=>x.userId===userId).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')).slice(0,10)}
function showModal(content,wide=false){$('modalContent').classList.toggle('modal-narrow',!wide);$('modalContent').innerHTML=content;$('modalOverlay').classList.add('open');document.body.style.overflow='hidden';const first=$('modalContent').querySelector('input:not([type=hidden]),textarea,select,button');if(first)setTimeout(()=>first.focus(),50)}
function closeModal(){$('modalOverlay').classList.remove('open');$('modalContent').innerHTML='';document.body.style.overflow='';state.editingProjectId=null;state.editingReminderId=null}
function updateChrome(){const user=state.activeUser;$('userSwitchText').textContent=user?user.name:'创建本地用户';$('userSwitch').querySelector('.user-avatar').textContent=user?(user.avatar||'🌱'):'＋';$('sideUserStatus').textContent=user?`当前本地用户：${user.name}`:'等待创建本地用户';$('breadcrumbCurrent').textContent=user?({home:'工作台总览',projects:'项目分类',reminders:'提醒事项总览',backup:'数据备份'}[state.view]||'工作台总览'):'本地初始化';document.querySelectorAll('#mainNav [data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view))}
function shellHeader(overline,title,subtitle,action=''){return `<div class="page-head"><div><div class="eyebrow">${overline}</div><h1>${title}</h1><p>${subtitle}</p></div>${action}</div>`}
function emptyStage(icon,title,copy,buttonText,action){return `<section class="empty-stage"><div class="empty-content"><div class="empty-icon">${icon}</div><h3>${title}</h3><p>${copy}</p>${buttonText?`<button class="btn btn-primary" data-action="${action}">${buttonText}　→</button>`:''}</div></section>`}
function render(){updateChrome();const view=$('appView');if(!state.activeUser){view.innerHTML=state.view==='home'?renderUserGate():renderNoUserView();return}if(state.view==='projects'){view.innerHTML=renderProjects();return}if(state.view==='reminders'){view.innerHTML=renderReminders();return}if(state.view==='backup'){view.innerHTML=renderBackup();return}view.innerHTML=renderHome()}
function renderNoUserView(){const labels={projects:['项目分类','创建本地用户后，这里才会显示你建立的项目。'],reminders:['提醒事项总览','创建或选择本地用户后，才能查看和管理提醒事项。'],backup:['数据备份','先进入本地用户空间，才能备份或恢复它的数据。']};const [title,copy]=labels[state.view]||['尚未进入本地空间','请先创建或选择一个本地用户。'];const none=!state.users.length;return `${shellHeader('LOCAL FIRST / USER REQUIRED',title,copy)}${emptyStage('♙',none?'未创建用户':'未选择本地用户',none?'当前浏览器还没有本地用户。先创建一个用户，再建立项目或提醒事项。':'当前没有选中的本地用户。请返回工作台选择已有用户，或创建新的本地用户。',none?'创建本地用户':'选择本地用户',none?'new-user':'select-user')}`}
function renderUserGate(){if(!state.users.length)return `${shellHeader('WELCOME / FIRST SETUP','先创建你的本地用户','这里不需要联网注册。创建的只是当前浏览器里的个人资料，同一网址下次打开时会继续读取上次的数据。')}<section class="hero"><div class="hero-copy"><div class="hero-kicker">FUDONG CONVENIENCE STORE · PERSONAL DESK</div><h2>从一张空白桌面开始，<br><span>慢慢搭出自己的秩序。</span></h2><p>没有预置项目或提醒事项。先给这份本地空间取一个名字，再按自己的方式安排项目与时间。</p></div><div class="hero-art" aria-hidden="true"><div class="hero-sign">LOCAL ONLY</div><div class="shelf"><i class="bottle"></i><i class="bottle"></i><i class="bottle"></i><i class="bottle"></i><i class="bottle"></i><i class="bottle"></i><i class="bottle"></i><i class="bottle"></i></div></div></section><section class="panel"><div class="panel-head"><div><h3>创建本地用户</h3><small>所有资料都保存在当前浏览器中</small></div><span class="status-text">STEP 01 / 02</span></div><form id="firstUserForm"><div class="form-grid"><div class="form-field"><label for="firstUserName">用户名称 *</label><input id="firstUserName" maxlength="32" required placeholder="例如：我的工作空间" autocomplete="nickname"></div><div class="form-field"><label for="firstUserAvatar">选择一个标记</label><select id="firstUserAvatar"><option value="🌱">🌱 小芽</option><option value="☕">☕ 咖啡</option><option value="🧋">🧋 饮品</option><option value="🎨">🎨 创作</option><option value="📚">📚 学习</option><option value="🌙">🌙 夜班</option><option value="🧸">🧸 放松</option></select></div></div><div class="modal-actions"><small style="font-size:9px;color:#8a9999">本地用户不使用密码，也不是网络账号。</small><div class="modal-actions-right"><button class="btn btn-primary" type="submit">创建本地用户　→</button></div></div></form></section>`;return `${shellHeader('LOCAL USERS / PROFILE','选择一个本地用户','检测到这个浏览器里已有本地资料。请选择要继续使用的空间，或创建另一个相互独立的本地用户。')}<section class="panel"><div class="panel-head"><h3>这个浏览器里的本地用户</h3><button class="btn btn-primary btn-small" data-action="new-user">＋ 创建新用户</button></div><div class="user-card-list">${state.users.map(u=>`<button class="user-choice" data-user-id="${esc(u.id)}"><span>${esc(u.avatar||'🌱')}</span><span style="flex:1"><strong>${esc(u.name)}</strong><small>创建于 ${fmtDate(u.createdAt)}</small></span><span>进入　→</span></button>`).join('')}</div></section>`}
function projectFor(id){return state.projects.find(p=>p.id===id)||null}
function reminderForDay(date){return state.reminders.filter(r=>r.status!=='done'&&r.dueAt&&localDate(new Date(r.dueAt))===date).sort((a,b)=>(a.dueAt||'').localeCompare(b.dueAt||''))}
function isOverdue(reminder){return reminder.status!=='done'&&reminder.dueAt&&new Date(reminder.dueAt).getTime()<Date.now()}
function renderCalendar(){const cursor=state.calendarCursor;const year=cursor.getFullYear(),month=cursor.getMonth();const first=new Date(year,month,1);const offset=(first.getDay()+6)%7;const start=new Date(year,month,1-offset);const days=['一','二','三','四','五','六','日'];let cells='';for(let i=0;i<42;i++){const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);const key=localDate(d);const inMonth=d.getMonth()===month;const dayItems=state.reminders.filter(r=>r.status!=='done'&&r.dueAt&&localDate(new Date(r.dueAt))===key);cells+=`<button class="calendar-day ${inMonth?'':'outside'} ${key===localDate()?'today':''} ${key===state.selectedDate?'selected':''}" data-action="select-day" data-date="${key}" aria-label="${key}，${dayItems.length} 条待办"><span class="day-number">${d.getDate()}</span><span class="day-dots">${dayItems.slice(0,3).map(r=>`<i class="day-dot ${isOverdue(r)?'overdue':''}"></i>`).join('')}</span></button>`}const selected=reminderForDay(state.selectedDate);const selectedAll=state.reminders.filter(r=>r.dueAt&&localDate(new Date(r.dueAt))===state.selectedDate).sort((a,b)=>(a.dueAt||'').localeCompare(b.dueAt||''));const agenda=selectedAll.length?`<div class="reminder-list">${selectedAll.map(reminderRow).join('')}</div>`:`<div class="empty-mini">这一天还没有安排提醒。<br><button class="btn btn-plain btn-small" style="margin-top:8px" data-action="create-reminder">＋ 为这一天添加提醒</button></div>`;return `<section class="surface-card calendar-panel"><div class="calendar-toolbar"><div><div class="section-title">时间日历</div><div class="section-caption">点选日期查看当天安排 · ${selected.length} 条待处理</div></div><div class="calendar-arrows"><button class="icon-action" data-action="calendar-prev" aria-label="上个月">‹</button><button class="icon-action" data-action="calendar-today">今天</button><button class="icon-action" data-action="calendar-next" aria-label="下个月">›</button></div></div><div class="calendar-toolbar"><div class="calendar-month">${new Intl.DateTimeFormat('zh-CN',{year:'numeri function miniReminder(reminder){const project=projectFor(reminder.projectId);return `<article class="overview-reminder"><div class="reminder-mark">${isOverdue(reminder)?'!':'◷'}</div><div><div class="overview-reminder-title">${esc(reminder.title)}</div><div class="overview-reminder-meta">${reminder.dueAt?esc(fmtDateTime(reminder.dueAt)):'未设定时间'}<br>${project?`项目：${esc(project.name)}`:'未关联项目'}</div></div><button class="btn btn-plain btn-small" data-action="edit-reminder" data-id="${esc(reminder.id)}">打开</button></article>`}

function projectCounts(projectId){const linked=state.reminders.filter(r=>r.projectId===projectId);return {active:linked.filter(r=>r.status!=='done').length,done:linked.filter(r=>r.status==='done').length,next:linked.filter(r=>r.status!=='done'&&r.dueAt).sort((a,b)=>a.dueAt.localeCompare(b.dueAt))[0]||null}}

function renderProjects(){const project=state.selectedProjectId?projectFor(state.selectedProjectId):null;if(state.selectedProjectId&&!project)state.selectedProjectId=null;if(project){const reminders=state.reminders.filter(r=>r.projectId===project.id).sort((a,b)=>{if(a.status!==b.status)return a.status==='done'?1:-1;return (a.dueAt||'9999').localeCompare(b.dueAt||'9999')});const active=reminders.filter(r=>r.status!=='done');const done=reminders.filter(r=>r.status==='done');return `${shellHeader('PROJECTS / PROJECT SPACE','项目详情','项目是你组织工作的核心空间。相关提醒事项可以在这里创建，并在提醒总览中跳回项目。',`<button class="btn btn-primary" data-action="create-reminder" data-project-id="${esc(project.id)}">＋ 添加提醒事项</button>`)}<div class="project-detail-hero"><div class="project-icon" style="--project-soft:${esc(project.color||'#8bcdb3')}22">${esc(project.icon||'▦')}</div><div class="project-detail-copy"><h2>${esc(project.name)}</h2><p>${esc(project.description||'这个项目还没有说明。可以编辑项目，补充用途和背景。')}</p><div class="project-stats"><span class="project-stat">待处理 ${active.length}</span><span class="project-stat">已完成 ${done.length}</span><span class="project-status ${project.status==='paused'?'paused':project.status==='completed'?'completed':''}">${({active:'进行中',paused:'暂缓',completed:'已完成'}[project.status]||'进行中')}</span></div></div><div class="project-detail-actions"><button class="btn btn-plain btn-small" data-action="edit-project" data-id="${esc(project.id)}">编辑项目</button><button class="btn btn-plain btn-small" data-action="delete-project" data-id="${esc(project.id)}">删除项目</button><button class="btn btn-plain btn-small" data-action="close-project-detail">返回项目列表</button></div></div><section class="surface-card"><div class="section-head"><div><div class="section-title">关联提醒事项</div><div class="section-caption">这份提醒总览会显示项目关联，并可从提醒跳回此处。</div></div><button class="btn btn-primary btn-small" data-action="create-reminder" data-project-id="${esc(project.id)}">＋ 新建提醒</button></div>${reminders.length?`<div class="reminder-list">${reminders.map(reminderRow).join('')}</div>`:`<div class="empty-mini"><strong>这个项目还没有提醒事项</strong>可以先添加一件下一步要做的事。<br><button class="btn btn-primary btn-small" style="margin-top:10px" data-action="create-reminder" data-project-id="${esc(project.id)}">＋ 创建关联提醒</button></div>`}</section>`}const body=state.projects.length?`<div class="project-grid">${state.projects.map(projectCard).join('')}</div>`:emptyStage('▦','还没有项目分类','项目用于归拢同一件事的内容。先创建项目，再在项目中挂上对应提醒事项。','创建第一个项目','create-project');return `${shellHeader('PROJECTS / ORGANIZE YOUR WORK','项目分类','每个项目都有独立的说明和提醒事项。你可以从项目内部创建提醒，也能从总览跳回项目。',`<button class="btn btn-primary" data-action="create-project">＋ 新建项目</button>`)}${body}`}
function reminderRow(reminder){const project=projectFor(reminder.projectId);const due=reminder.dueAt?fmtDateTime(reminder.dueAt):'未设置时间';return `<article class="reminder-row ${reminder.status==='done'?'done':''}"><div class="reminder-mark">${reminder.status==='done'?'✓':isOverdue(reminder)?'!':'◷'}</div><div class="reminder-info"><strong>${esc(reminder.title)}</strong>${reminder.note?`<p>${esc(reminder.note)}</p>`:''}<small>${esc(due)}　·　<span class="status-chip ${reminder.status==='done'?'done':''}">${reminder.status==='done'?'已完成':isOverdue(reminder)?'已逾期':'待处理'}</span></small><div class="reminder-project">${project?`<button class="project-link" data-action="open-project" data-id="${esc(project.id)}">▦ ${esc(project.name)}　查看项目 ↗</button>`:'<span class="project-stat">未关联项目</span>'}</div></div><div class="row-actions"><button class="icon-action" data-action="toggle-reminder" data-id="${esc(reminder.id)}">${reminder.status==='done'?'重新打开':'完成'}</button><button class="icon-action" data-action="edit-reminder" data-id="${esc(reminder.id)}">编辑</button><button class="icon-action" data-action="delete-reminder" data-id="${esc(reminder.id)}">删除</button></div></article>`}
function renderReminders(){const filter=state.reminderFilter;const projectFilter=state.reminderProjectFilter||'';let list=state.reminders.filter(r=>filter==='all'||(filter==='done'?r.status==='done':r.status!=='done'));if(projectFilter==='__none__')list=list.filter(r=>!r.projectId);else if(projectFilter)list=list.filter(r=>r.projectId===projectFilter);const active=list.filter(r=>r.status!=='done');const done=list.filter(r=>r.status==='done');const body=list.length?`${active.length?`<div class="section-head"><div><div class="section-title">待处理事项</div><div class="section-caption">${active.length} 条待处理，其中 ${active.filter(isOverdue).length} 条已逾期</div></div></div><div class="reminder-list">${active.map(reminderRow).join('')}</div>`:''}${done.length?`<div class="section-head" style="margin-top:24px"><div><div class="section-title">已完成</div><div class="section-caption">${done.length} 条已完成事项</div></div></div><div class="reminder-list">${done.map(reminderRow).join('')}</div>`:''}`:`<div class="empty-mini"><strong>${projectFilter?'这个项目下还没有匹配的提醒':'还没有符合筛选条件的提醒'}</strong>可以创建一份新的提醒事项，并可选择关联项目。<br><button class="btn btn-primary btn-small" style="margin-top:9px" data-action="create-reminder" ${projectFilter?`data-project-id="${esc(projectFilter)}"`:''}>＋ 新建提醒</button></div>`;return `${shellHeader('REMINDERS / ALL PLANS','提醒事项总览','集中查看所有项目与日常提醒。每条提醒都会显示关联项目，并能一键跳转到项目详情。',`<button class="btn btn-primary" data-action="create-reminder">＋ 新建提醒</button>`)}<div class="filter-bar"><button class="filter-chip ${filter==='active'?'active':''}" data-action="filter-reminders" data-filter="active">待处理</button><button class="filter-chip ${filter==='all'?'active':''}" data-action="filter-reminders" data-filter="all">全部事项</button><button class="filter-chip ${filter==='done'?'active':''}" data-action="filter-reminders" data-filter="done">已完成</button><select id="reminderProjectFilter" aria-label="按项目筛选"><option value="">所有项目</option>${state.projects.map(p=>`<option value="${esc(p.id)}" ${p.id===projectFilter?'selected':''}>${esc(p.name)}</option>`).join('')}<option value="__none__" ${projectFilter==='__none__'?'selected':''}>未关联项目</option></select></div>${body}`}
function projectModal(project=null){if(!state.activeUser){toast('请先创建或选择本地用户。');return}state.editingProjectId=project?.id||null;const icons=['▦','🎬','🎨','📦','💻','📚','🧪','⭐','🎧','🏪','🧰','✍️'];const colors=['#8bcdb3','#f4c49a','#eaa8b6','#a8c9dd','#b9b1df','#e1bc6d'];const color=project?.color||colors[0];showModal(`<div class="modal-head"><div><h2 id="modalTitle">${project?'编辑项目':'创建项目分类'}</h2><p>为一件持续推进的事情建立空间，之后可以将相关提醒事项关联到它。</p></div><button class="close-button" type="button" data-action="close-modal">×</button></div><form id="projectForm"><div class="form-grid"><div class="form-field full"><label for="projectName">项目名称 *</label><input id="projectName" required maxlength="80" value="${esc(project?.name||'')}" placeholder="例如：便利店频道改版"></div><div class="form-field full"><label for="projectDescription">项目说明（可选）</label><textarea id="projectDescription" maxlength="1000" placeholder="项目目标、背景或主要工作内容">${esc(project?.description||'')}</textarea></div><div class="form-field"><label for="projectIcon">项目图标</label><select id="projectIcon">${icons.map(i=>`<option value="${esc(i)}" ${(project?.icon||'▦')===i?'selected':''}>${esc(i)}　${i==='▦'?'项目':i==='🎬'?'视频':i==='🎨'?'设计':i==='📦'?'周边':i==='💻'?'技术':i==='📚'?'学习':i==='🧪'?'实验':i==='⭐'?'重要':i==='🎧'?'音频':i==='🏪'?'便利店':i==='🧰'?'工具':'创作'}</option>`).join('')}</select></div><div class="form-field"><label for="projectStatus">项目状态</label><select id="projectStatus"><option value="active" ${!project||project.status==='active'?'selected':''}>进行中</option><option value="paused" ${project?.status==='paused'?'selected':''}>暂缓</option><option value="completed" ${project?.status==='completed'?'selected':''}>已完成</option></select></div><div class="form-field full"><label>项目颜色</label><div class="project-color-swatches">${colors.map(c=>`<label class="project-color-option"><input type="radio" name="projectColor" value="${c}" ${c===color?'checked':''}><span style="background:${c}"></span></label>`).join('')}</div></div></div><div class="modal-actions"><s async function saveProject(event){event.preventDefault();if(!state.activeUser){toast('请先创建或选择本地用户。');return}const name=$('projectName').value.trim();if(!name){$('projectName').focus();return}const old=state.projects.find(p=>p.id===state.editingProjectId);const now=new Date().toISOString();const selectedColor=document.querySelector('input[name="projectColor"]:checked')?.value||'#8bcdb3';const project={id:old?.id||uid('prj'),userId:state.activeUser.id,name,description:$('projectDescription').value.trim(),icon:$('projectIcon').value,color:selectedColor,status:$('projectStatus').value,createdAt:old?.createdAt||now,updatedAt:now};await put('projects',project);await reloadWorkspace();state.selectedProjectId=project.id;state.view='projects';closeModal();render();toast(old?'项目已更新。':'项目已创建，可以为它添加提醒事项。')}
async function deleteProject(id){const project=projectFor(id);if(!project)return;const linked=state.reminders.filter(r=>r.projectId===id);const message=linked.length?`项目「${project.name}」关联了 ${linked.length} 条提醒。删除项目不会删除提醒，但会解除它们的项目关联。确定继续吗？`:`确定删除项目「${project.name}」吗？`;if(!confirm(message))return;await new Promise((resolve,reject)=>{const transaction=state.db.transaction(['projects','reminders'],'readwrite');transaction.objectStore('projects').delete(id);const store=transaction.objectStore('reminders');const request=store.index('projectId').openCursor(IDBKeyRange.only(id));request.onsuccess=()=>{const cursor=request.result;if(cursor){cursor.update({...cursor.value,projectId:null,updatedAt:new Date().toISOString()});cursor.continue()}};transaction.oncomplete=resolve;transaction.onerror=()=>reject(transaction.error);transaction.onabort=()=>reject(transaction.error)});state.selectedProjectId=null;await reloadWorkspace();render();toast('项目已删除，原提醒事项仍然保留。')}
function reminderModal(reminder=null,projectId=null){if(!state.activeUser){toast('请先创建或选择本地用户。');return}state.editingReminderId=reminder?.id||null;const selectedProject=projectId||reminder?.projectId||'';showModal(`<div class="modal-head"><div><h2 id="modalTitle">${reminder?'编辑提醒事项':'新建提醒事项'}</h2><p>可以从项目内创建关联提醒，也可以创建不属于具体项目的日常提醒。</p></div><button class="close-button" type="button" data-action="close-modal">×</button></div><form id="reminderForm"><div class="form-grid"><div class="form-field full"><label for="reminderTitle">提醒内容 *</label><input id="reminderTitle" required maxlength="120" value="${esc(reminder?.title||'')}" placeholder="例如：完成项目首页的交互稿"></div><div class="form-field full"><label for="reminderProject">关联项目</label><select id="reminderProject"><option value="">不关联项目（日常提醒）</option>${state.projects.map(p=>`<option value="${esc(p.id)}" ${selectedProject===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><small>关联项目后，可以从提醒总览一键跳转到项目详情。</small></div><div class="form-field"><label for="reminderDue">日期与时间（可选）</label><input id="reminderDue" type="datetime-local" value="${esc(toLocalDateTimeValue(reminder?.dueAt))}"></div><div class="form-field"><label for="reminderStatus">事项状态</label><select id="reminderStatus"><option value="active" ${!reminder||reminder.status!=='done'?'selected':''}>待处理</option><option value="done" ${reminder?.status==='done'?'selected':''}>已完成</option></select></div><div class="form-field full"><label for="reminderNote">补充说明（可选）</label><textarea id="reminderNote" maxlength="1000" placeholder="背景、链接或准备事项">${esc(reminder?.note||'')}</textarea></div></div><div class="modal-actions"><small style="font-size:9px;color:#8a9999">只保存在当前本地用户的浏览器空间中。</small><div class="modal-actions-right"><button class="btn btn-plain" type="button" data-action="close-modal">取消</button><button class="btn btn-primary" type="submit">保存提醒</button></div></div></form>`,true)}
async function saveReminder(event){event.preventDefault();if(!state.activeUser){toast('请先创建或选择本地用户。');return}const title=$('reminderTitle').value.trim();if(!title){$('reminderTitle').focus();return}const dueRaw=$('reminderDue').value;const projectId=$('reminderProject').value||null;const old=state.reminders.find(r=>r.id===state.editingReminderId);const now=new Date().toISOString();const reminder={id:old?.id||uid('rem'),userId:state.activeUser.id,projectId,title,note:$('reminderNote').value.trim(),dueAt:dueRaw?new Date(dueRaw).toISOString():null,status:$('reminderStatus').value||old?.status||'active',createdAt:old?.createdAt||now,updatedAt:now};await put('reminders',reminder);await reloadWorkspace();closeModal();state.view='reminders';state.reminderFilter='active';render();toast(old?'提醒事项已更新。':'提醒事项已保存。')}

async function toggleReminder(id){const reminder=state.reminders.find(r=>r.id===id);if(!reminder)return;await put('reminders',{...reminder,status:reminder.status==='done'?'active':'done',updatedAt:new Date().toISOString()});await reloadWorkspace();render();toast(reminder.status==='done'?'提醒事项已重新打开。':'提醒事项已标记完成。')}
function renderBackup(){const options=[['0','关闭自动备份'],['3600000','每 1 小时'],['21600000','每 6 小时'],['86400000','每天'],['604800000','每 7 天']];const selected=Number(state.settings?.autoBackupIntervalMs||0);const history=state.backups.length?`<div class="backup-history">${state.backups.slice(0,8).map(b=>`<div class="backup-item"><div><strong>${b.automatic?'自动备份':'手动快照'} · ${esc(fmtDateTime(b.createdAt))}</strong><small>${(b.payload?.projects||[]).length} 个项目 · ${(b.payload?.reminders||[]).length} 条提醒</small></div><button class="btn btn-plain btn-small" data-action="download-backup" data-id="${esc(b.id)}">下载文件</button></div>`).join('')}</div>`:'<div class="empty-inline">尚无本地快照。启用自动备份后会创建第一份快照。</div>';return `${shellHeader('DATA / LOCAL BACKUP','数据备份','备份当前用户的项目、提醒事项和设置。不会上传到任何服务器。')}<div class="card-grid"><section class="surface-card"><div class="template-glyph" style="background:var(--mint-soft)">⇩</div><h3 style="margin-top:13px">下载当前数据</h3><p>导出当前用户的项目、提醒事项和备份设置，不包含其他本地用户的数据。</p><div style="margin-top:15px"><button class="btn btn-primary" data-action="export">下载 JSON 备份</button></div></section><section class="surface-card"><div class="template-glyph" style="background:var(--blue-soft)">⇧</div><h3 style="margin-top:13px">从备份恢复</h3><p>导入先前下载的 JSON 文件，恢复前会请求确认，并替换当前用户的项目和提醒事项。</p><div style="margin-top:15px"><button class="btn btn-plain" data-action="import">选择 JSON 文件</button></div></section></div><section class="surface-card" style="margin-top:14px"><div class="template-glyph" style="background:var(--peach-soft)">◷</div><h3 style="margin-top:13px">自动备份周期</h3><p>自动快照保存在浏览器 IndexedDB 中。网页关闭期间不会后台运行，重新打开或切回页面时会检查是否到期。你可以单独下载快照文件保存到电脑。</p><div class="backup-setting"><label for="backupIntervalSelect">选择备份频率</label><select id="backupIntervalSelect">${options.map(([v,label])=>`<option value="${v}" ${selected===Number(v)?'selected':''}>${label}</option>`).join('')}</select><div><button class="btn btn-primary btn-small" data-action="save-backup-settings">保存备份设置</button><button class="btn btn-plain btn-small" style="margin-left:6px" data-action="backup-now">立即创建快照</button></div></div><div class="backup-note">最近保留 10 份自动或手动快照。为防止清理网站数据造成丢失，建议定期把 JSON 文件保存到电脑。</div><div class="section-head" style="margin-top:22px"><div><div class="section-title">本地备份历史</div><div class="section-caption">最近一次自动备份：${state.settings?.lastAutoBackupAt?esc(fmtDateTime(state.settings.lastAutoBackupAt)):'尚未创建'}</div></div></div>${history}</section><section class="surface-card" style="margin-top:14px"><div class="template-glyph" style="background:var(--purple-soft)">ⓘ</div><h3 style="margin-top:13px">本地存储说明</h3><p>同一浏览器打开同一网址时会继续上次数据。换设备、换浏览器、清除网站数据或使用无痕窗口后不会自动带过去。</p><div class="card-meta"><span class="tiny-dot"></span>IndexedDB · 本机存储</div></section>`}
function buildBackupPayload(){return {app:'fudong-store-workbench',schemaVersion:3,exportedAt:new Date().toISOString(),user:{name:state.activeUser.name,avatar:state.activeUser.avatar,createdAt:state.activeUser.createdAt},projects:state.projects,reminders:state.reminders,legacy:{templates:state.templates,records:state.records},settings:{autoBackupIntervalMs:Number(state.settings?.autoBackupIntervalMs||0)}}}
function downloadBackupPayload(data,filename){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportBackup(){if(!state.activeUser){toast('请先创建或选择本地用户。');return}downloadBackupPayload(buildBackupPayload(),`符冬便利店_${state.activeUser.name}_备份_${localDate()}.json`);toast('JSON 备份文件已开始下载。')}
async function trimBackupHistory(userId,keep=10){const all=(await allFrom('backups')).filter(x=>x.userId===userId).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));for(const item of all.slice(keep))await remove('backups',item.id)}
async function createBackupSnapshot({automatic=true,silent=false}={}){if(!state.activeUser||state.backupBusy)return false;state.backupBusy=true;try{const now=new Date().toISOString();const snapshot={id:uid('bak'),userId:state.activeUser.id,createdAt:now,automatic,payload:buildBackupPayload()};await put('backups',snapshot);const settings={...(state.settings||{}),userId:state.activeUser.id,lastBackupAt:now,...(automatic?{lastAutoBackupAt:now}:{}),updatedAt:now};await put('settings',settings);await trimBackupHistory(state.activeUser.id,10);await reloadWorkspace();if(state.view==='backup')render();if(!silent)toast(automatic?'自动备份快照已保存到浏览器。':'本地备份快照已创建，可在下方下载。');return true}catch(error){if(!silent)toast(`创建备份失败：${error.message||'本地存储不可用'}`);return false}finally{state.backupBusy=false}}
async function maybeAutoBackup(){if(!state.activeUser||state.backupBusy)return;const interval=Number(state.settings?.autoBackupIntervalMs||0);if(!interval)return;const base=state.settings?.lastAutoBackupAt||state.settings?.autoBackupStartedAt||state.activeUser.createdAt;const t=base?new Date(base).getTime():Date.now();if(!Number.isFinite(t)||Date.now()-t>=interval)await createBackupSnapshot({automatic:true,silent:true})}
async function saveBackupSettings(){if(!state.activeUser){toast('请先创建或选择本地用户。');return}const select=$('backupIntervalSelect');if(!select)return;const interval=Number(select.value)||0;const old=state.settings||{userId:state.activeUser.id,autoBackupIntervalMs:0,lastBackupAt:null};const enabled=Number(old.autoBackupIntervalMs||0)>0;const now=new Date().toISOString();state.settings={...old,userId:state.activeUser.id,autoBackupIntervalMs:interval,autoBackupStartedAt:interval?(enabled?old.autoBackupStartedAt||now:now):null,updatedAt:now};await put('settings',state.settings);if(interval&&!enabled){await createBackupSnapshot({automatic:true,silent:true});render();toast('已启用自动备份，并创建第一份本地快照。')}else{await reloadWorkspace();render();toast(interval?'自动备份周期已更新。':'自动备份已关闭。')}}
async function downloadSavedBackup(id){const snapshot=state.backups.find(x=>x.id===id);if(!snapshot){toast('找不到这份备份，请刷新页面后重试。');return}downloadBackupPayload(snapshot.payload,`符冬便利店_${state.activeUser.name}_本地备份_${String(snapshot.createdAt||localDate()).replace(/[:.]/g,'-')}.json`);toast('备份文件已开始下载。')}
function startBackupScheduler(){if(state.backupTimer)clearInterval(state.backupTimer);state.backupTimer=setInterval(()=>maybeAutoBackup().catch(()=>{}),60000);if(!state.backupVisibilityBound){document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')maybeAutoBackup().catch(()=>{})});window.addEventListener('focus',()=>maybeAutoBackup().catch(()=>{}));state.backupVisibilityBound=true}}
function switchUserModal(){showModal(`<div class="modal-head"><div><h2 id="modalTitle">切换本地用户</h2><p>每个本地用户拥有独立的项目、提醒和设置。</p></div><button class="close-button" type="button" data-action="close-modal">×</button></div><div class="user-card-list">${state.users.map(u=>`<button class="user-choice" data-action="switch-user" data-id="${esc(u.id)}"><span>${esc(u.avatar||'🌱')}</span><span style="flex:1"><strong>${esc(u.name)}${u.id===state.activeUser?.id?'（当前）':''}</strong><small>创建于 ${fmtDate(u.createdAt)}</small></span><span>进入 →</span></button>`).join('')}</div><div class="modal-actions"><button class="btn btn-plain" data-action="new-user">＋ 创建新用户</button><div class="modal-actions-right"><button class="btn btn-plain" data-action="close-modal">取消</button></div></div>`)}
function renderUserCreationModal(){showModal(`<div class="modal-head"><div><h2 id="modalTitle">创建本地用户</h2><p>只在当前浏览器创建本地空间，无需网络注册。</p></div><button class="close-button" type="button" data-action="close-modal">×</button></div><form id="newUserForm"><div class="form-grid"><div class="form-field full"><label for="newUserName">用户名称 *</label><input id="newUserName" maxlength="32" required placeholder="给本地空间取个名字"></div><div class="form-field full"><label for="newUserAvatar">空间标记</label><select id="newUserAvatar"><option value="🌱">🌱 小芽</option><option value="☕">☕ 咖啡</option><option value="🧋">🧋 饮品</option><option value="🎨">🎨 创作</option><option value="📚">📚 学习</option><option value="🌙">🌙 夜班</option><option value="🧸">🧸 放松</option></select></div></div><div class="modal-actions"><small style="font-size:9px;color:#8a9999">用户不使用密码，也不是网络账号。</small><div class="modal-actions-right"><button class="btn btn-plain" type="button" data-action="close-modal">取消</button><button class="btn btn-primary" type="submit">创建并进入</button></div></div></form>`)}
async function createUser(name,avatar){name=String(name||'').trim();if(!name)throw new Error('请填写用户名称。');const user={id:uid('user'),name,avatar:avatar||'🌱',createdAt:new Date().toISOString()};await put('users',user);await put('settings',{userId:user.id,autoBackupIntervalMs:0,lastBackupAt:null,autoBackupStartedAt:null,updatedAt:new Date().toISOString()});state.activeUser=user;rememberUserId(user.id);await reloadUsers();await reloadWorkspace();state.view='home';state.selectedProjectId=null;closeModal();render();startBackupScheduler();toast('本地用户已创建。你可以先建立项目，或直接添加第一份提醒。')}
async function activateUser(id){const user=state.users.find(u=>u.id===id);if(!user)return;state.activeUser=user;rememberUserId(user.id);await reloadWorkspace();if(!state.settings){state.settings={userId:id,autoBackupIntervalMs:0,lastBackupAt:null,autoBackupStartedAt:null};await put('settings',state.settings)}state.view='home';state.selectedProjectId=null;closeModal();render();startBackupScheduler();await maybeAutoBackup();toast(`已进入「${user.name}」的本地空间。`)}
async function deleteUserData(userId){await new Promise((resolve,reject)=>{const transaction=state.db.transaction(['projects','templates','records','reminders'],'readwrite');for(const name of ['projects','templates','records','reminders']){const store=transaction.objectStore(name);const cursor=store.index('userId').openCursor(IDBKeyRange.only(userId));cursor.onsuccess=()=>{const c=cursor.result;if(c){c.delete();c.continue()}}}transaction.oncomplete=resolve;transaction.onerror=()=>reject(transaction.error);transaction.onabort=()=>reject(transaction.error)})}
async function importBackup(file){if(!state.activeUser){toast('请先创建或选择本地用户。');return}try{const parsed=JSON.parse(await file.text());if(parsed.app!=='fudong-store-workbench'||![1,2,3].includes(parsed.schemaVersion))throw new Error('这不是受支持的符冬便利店备份文件。');if(parsed.schemaVersion===3&&!Array.isArray(parsed.projects))throw new Error('备份文件缺少项目数据。');if(parsed.schemaVersion<3&&(!Array.isArray(parsed.templates)||!Array.isArray(parsed.records)))throw new Error('旧版备份格式不完整。');const projects=(Array.isArray(parsed.projects)?parsed.projects:[]).filter(p=>p&&typeof p.id==='string'&&typeof p.name==='string').map(p=>({...p,userId:state.activeUser.id}));const projectIds=new Set(projects.map(p=>p.id));const reminders=(Array.isArray(parsed.reminders)?parsed.reminders:[]).filter(r=>r&&typeof r.id==='string'&&typeof r.title==='string').map(r=>({...r,userId:state.activeUser.id,projectId:projectIds.has(r.projectId)?r.projectId:null,status:r.status==='done'?'done':'active'}));const legacyTemplates=Array.isArray(parsed.legacy?.templates)?parsed.legacy.templates:(Array.isArray(parsed.templates)?parsed.templates:[]);const legacyRecords=Array.isArray(parsed.legacy?.records)?parsed.legacy.records:(Array.isArray(parsed.records)?parsed.records:[]);if(!confirm(`将用备份中的 ${projects.length} 个项目和 ${reminders.length} 条提醒事项替换当前用户「${state.activeUser.name}」的项目与提醒。旧版模板和记录会留在本地兼容数据中，不会显示在新版导航里。建议先下载当前备份。继续吗？`))return;const userId=state.activeUser.id;await deleteUserData(userId);await new Promise((resolve,reject)=>{const transaction=state.db.transaction(['projects','templates','records','reminders','settings'],'readwrite');for(const p of projects)transaction.objectStore('projects').put(p);for(const r of reminders)transaction.objectStore('reminders').put(r);for(const t of legacyTemplates.filter(x=>x&&typeof x.id==='string'&&typeof x.name==='string'))transaction.objectStore('templates').put({...t,userId});const validTemplates=new Set(legacyTemplates.map(t=>t.id));for(const r of legacyRecords.filter(x=>x&&typeof x.id==='string'&&typeof x.title==='string'))transaction.objectStore('records').put({...r,userId});const current=state.settings||{userId,autoBackupIntervalMs:0,lastBackupAt:null};transaction.objectStore('settings').put({...current,autoBackupIntervalMs:Number(parsed.settings?.autoBackupIntervalMs||0),autoBackupStartedAt:Number(parsed.settings?.autoBackupIntervalMs||0)?(current.autoBackupStartedAt||new Date().toISOString()):null,userId,updatedAt:new Date().toISOString()});transaction.oncomplete=resolve;transaction.onerror=()=>reject(transaction.error)});await reloadWorkspace();state.selectedProjectId=null;state.view='home';render();toast('备份恢复完成。')}catch(error){toast(`导入失败：${error.message||'文件格式不正确'}`)}finally{$('importFile').value=''}}
function performAction(target){const action=target.dataset.action,id=target.dataset.id;if(!action)return;if(action==='close-modal')return closeModal();if(action==='new-user'){closeModal();renderUserCreationModal();return}if(action==='select-user'){state.view='home';render();return}if(action==='switch-user')return activateUser(id);if(['create-project','edit-project','delete-project','create-reminder','edit-reminder','delete-reminder','toggle-reminder','export','import','save-backup-settings','backup-now','download-backup'].includes(action)&&!state.activeUser){toast('请先创建或选择本地用户。');state.view='home';render();return}if(action==='create-project')return projectModal();if(action==='edit-project')return projectModal(projectFor(id));if(action==='delete-project')return deleteProject(id);if(action==='open-project'){state.selectedProjectId=id;state.view='projects';render();return}if(action==='close-project-detail'){state.selectedProjectId=null;state.view='projects';render();return}if(action==='create-reminder')return reminderModal(null,target.dataset.projectId||null);if(action==='edit-reminder')return reminderModal(state.reminders.find(r=>r.id===id));if(action==='delete-reminder')return deleteReminder(id);if(action==='toggle-reminder')return toggleReminder(id);if(action==='filter-reminders'){state.reminderFilter=target.dataset.filter||'active';render();return}if(action==='calendar-prev'){state.calendarCursor=new Date(state.calendarCursor.getFullYear(),state.calendarCursor.getMonth()-1,1);render();return}if(action==='calendar-next'){state.calendarCursor=new Date(state.calendarCursor.getFullYear(),state.calendarCursor.getMonth()+1,1);render();return}if(action==='calendar-today'){state.calendarCursor=new Date(new Date().getFullYear(),new Date().getMonth(),1);state.selectedDate=localDate();render();return}if(action==='select-day'){state.selectedDate=target.dataset.date;render();return}if(action==='export')return exportBackup();if(action==='import')return $('importFile').click();if(action==='save-backup-settings')return saveBackupSettings();if(action==='backup-now')return createBackupSnapshot({automatic:false,silent:false});if(action==='download-backup')return downloadSavedBackup(id)}
function bindEvents(){document.addEventListener('click',event=>{const actionTarget=event.target.closest('[data-action]');if(actionTarget){event.preventDefault();performAction(actionTarget);return}const nav=event.target.closest('[data-view]');if(nav){event.preventDefault();state.view=nav.dataset.view;state.selectedProjectId=null;render();return}const choice=event.target.closest('[data-user-id]');if(choice){activateUser(choice.dataset.userId);return}});$('userSwitch').addEventListener('click',()=>{if(!state.users.length){state.view='home';render();return}switchUserModal()});$('modalOverlay').addEventListener('click',event=>{if(event.target===$('modalOverlay'))closeModal()});document.addEventListener('keydown',event=>{if(event.key==='Escape')closeModal()});document.addEventListener('submit',async event=>{const form=event.target;if(form.id==='firstUserForm'){event.preventDefault();try{await createUser($('firstUserName').value,$('firstUserAvatar').value)}catch(error){toast(`创建失败：${error.message}`)}return}if(form.id==='newUserForm'){event.preventDefault();try{await createUser($('newUserName').value,$('newUserAvatar').value)}catch(error){toast(`创建用户失败：${error.message}`)}return}if(form.id==='projectForm'){try{await saveProject(event)}catch(error){toast(`保存项目失败：${error.message||'未知错误'}`)}return}if(form.id==='reminderForm'){try{await saveReminder(event)}catch(error){toast(`保存提醒失败：${error.message||'未知错误'}`)}return}});document.addEventListener('change',event=>{if(event.target.id==='reminderProjectFilter'){state.reminderProjectFilter=event.target.value;render()}});$('importFile').addEventListener('change',event=>{const file=event.target.files?.[0];if(file)importBackup(file)})}
async function bootstrap(){bindEvents();try{state.db=await openDB();await reloadUsers();const stored=getRememberedUserId();state.activeUser=state.users.find(u=>u.id===stored)||null;if(state.activeUser){await reloadWorkspace();state.view='home'}else state.view='home';render();startBackupScheduler();if(state.activeUser){await maybeAutoBackup();toast(`已从浏览器读取「${state.activeUser.name}」的上次数据。`)}}catch(error){$('appView').innerHTML=`<section class="empty-stage"><div class="empty-content"><div class="empty-icon">!</div><h3>无法打开本地数据库</h3><p>${esc(error.message||'当前浏览器无法使用 IndexedDB。')}<br>请使用常见的现代浏览器，并通过固定的网站地址访问。</p><button class="btn btn-primary" onclick="location.reload()">重新尝试</button></div></section>`}}
bootstrap();
})();
</script>
