</div>

<div class="overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal" id="modalContent"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
'use strict';
const DB_NAME='fudong_store_workbench_v1';
const DB_VERSION=2;
const ACTIVE_USER_KEY='fudong-store-active-user-v1';
const $=id=>document.getElementById(id);
const state={db:null,users:[],activeUser:null,templates:[],records:[],reminders:[],settings:null,backups:[],view:'home',toastTimer:null,editingTemplateId:null,editingRecordId:null,editingReminderId:null,activeTemplateForRecord:null,backupTimer:null,backupBusy:false};
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=prefix=>`${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,10)}`;
function getRememberedUserId(){try{return localStorage.getItem(ACTIVE_USER_KEY)}catch{return null}}
function rememberUserId(id){try{localStorage.setItem(ACTIVE_USER_KEY,id)}catch{/* IndexedDB still saves the workspace; only auto-select is unavailable. */}}
const fmtDate=value=>{if(!value)return '未设置日期';const d=new Date(value);return Number.isNaN(d.getTime())?String(value):new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'short',day:'numeric'}).format(d)};
const localDate=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>el.classList.remove('show'),2700)}
function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(new Error('当前浏览器不支持 IndexedDB'));return}const request=indexedDB.open(DB_NAME,DB_VERSION);request.onupgradeneeded=()=>{const db=request.result;if(!db.objectStoreNames.contains('users')){const store=db.createObjectStore('users',{keyPath:'id'});store.createIndex('createdAt','createdAt',{unique:false})}if(!db.objectStoreNames.contains('templates')){const store=db.createObjectStore('templates',{keyPath:'id'});store.createIndex('userId','userId',{unique:false});store.createIndex('updatedAt','updatedAt',{unique:false})}if(!db.objectStoreNames.contains('records')){const store=db.createObjectStore('records',{keyPath:'id'});store.createIndex('userId','userId',{unique:false});store.createIndex('templateId','templateId',{unique:false});store.createIndex('updatedAt','updatedAt',{unique:false})}if(!db.objectStoreNames.contains('reminders')){const store=db.createObjectStore('reminders',{keyPath:'id'});store.createIndex('userId','userId',{unique:false});store.createIndex('dueAt','dueAt',{unique:false});store.createIndex('updatedAt','updatedAt',{unique:false})}if(!db.objectStoreNames.contains('settings'))db.createObjectStore('settings',{keyPath:'userId'});if(!db.objectStoreNames.contains('backups')){const store=db.createObjectStore('backups',{keyPath:'id'});store.createIndex('userId','userId',{unique:false});store.createIndex('createdAt','createdAt',{unique:false})}};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error||new Error('无法打开本地数据库'));request.onblocked=()=>reject(new Error('本地数据库正在被另一个页面占用，请关闭其他工作台标签后重试'))})}
function tx(storeNames,mode,executor){return new Promise((resolve,reject)=>{const transaction=state.db.transaction(storeNames,mode);let result;try{result=executor(transaction)}catch(error){reject(error);return}transaction.oncomplete=()=>resolve(result);transaction.onerror=()=>reject(transaction.error||new Error('本地数据写入失败'));transaction.onabort=()=>reject(transaction.error||new Error('本地事务已取消'))})}
function req(request){return new Promise((resolve,reject)=>{request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error||new Error('本地数据读取失败'))})}
async function allFrom(storeName){const transaction=state.db.transaction([storeName],'readonly');return req(transaction.objectStore(storeName).getAll())}
async function reloadUsers(){state.users=(await allFrom('users')).sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''))}
async function reloadWorkspace(){if(!state.activeUser){state.templates=[];state.records=[];state.reminders=[];state.settings=null;state.backups=[];return}const userId=state.activeUser.id;const [templates,records,reminders,settings,backups]=await Promise.all([allFrom('templates'),allFrom('records'),allFrom('reminders'),req(state.db.transaction(['settings'],'readonly').objectStore('settings').get(userId)),allFrom('backups')]);state.templates=templates.filter(x=>x.userId===userId).sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));state.records=records.filter(x=>x.userId===userId).sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));state.reminders=reminders.filter(x=>x.userId===userId).sort((a,b)=>(a.status===b.status?((a.dueAt||'9999').localeCompare(b.dueAt||'9999')):(a.status==='done'?1:-1)));state.settings=settings||{userId,autoBackupIntervalMs:0,lastBackupAt:null,autoBackupStartedAt:null};state.backups=backups.filter(x=>x.userId===userId).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')).slice(0,10)}
async function put(storeName,value){await tx([storeName],'readwrite',t=>t.objectStore(storeName).put(value))}
async function remove(storeName,id){await tx([storeName],'readwrite',t=>t.objectStore(storeName).delete(id))}
async function deleteUserData(userId){await new Promise((resolve,reject)=>{const transaction=state.db.transaction(['templates','records','reminders'],'readwrite');for(const name of ['templates','records','reminders']){const store=transaction.objectStore(name);const cursor=store.index('userId').openCursor(IDBKeyRange.only(userId));cursor.onsuccess=()=>{const c=cursor.result;if(c){c.delete();c.continue()}}}transaction.oncomplete=resolve;transaction.onerror=()=>reject(transaction.error);transaction.onabort=()=>reject(transaction.error)})}
function showModal(html,wide=false){$('modalContent').classList.toggle('modal-narrow',!wide);$('modalContent').innerHTML=html;$('modalOverlay').classList.add('open');document.body.style.overflow='hidden';const first=$('modalContent').querySelector('input:not([type=hidden]),textarea,select,button');if(first)setTimeout(()=>first.focus(),50)}
function closeModal(){$('modalOverlay').classList.remove('open');$('modalContent').innerHTML='';document.body.style.overflow='';state.editingTemplateId=null;state.editingRecordId=null;state.editingReminderId=null;state.activeTemplateForRecord=null}
function updateChrome(){const user=state.activeUser;$('userSwitchText').textContent=user?user.name:'创建本地用户';$('userSwitch').querySelector('.user-avatar').textContent=user?(user.avatar||'🌱'):'＋';$('sideUserStatus').textContent=user?`当前本地用户：${user.name}`:'等待创建本地用户';$('breadcrumbCurrent').textContent=user?({home:'工作台总览',templates:'我的模板',records:'我的记录',reminders:'提醒事项',backup:'数据备份'}[state.view]||'工作台总览'):'本地初始化';document.querySelectorAll('#mainNav [data-view]').forEach(button=>button.classList.toggle('active',button.dataset.view===state.view))}
function shellHeader(overline,title,subtitle,action=''){return `<div class="page-head"><div><div class="eyebrow">${overline}</div><h1>${title}</h1><p>${subtitle}</p></div>${action}</div>`}
function emptyStage(icon,title,copy,buttonText,action,step=1){return `<section class="empty-stage"><div class="empty-content"><div class="empty-icon">${icon}</div><h3>${title}</h3><p>${copy}</p><div class="steps"><span class="step-chip ${step===1?'active':''}"><b>1</b>创建本地用户</span><span class="step-chip ${step===2?'active':''}"><b>2</b>创建第一个模板</span><span class="step-chip ${step===3?'active':''}"><b>3</b>新增第一条记录</span></div><button class="btn btn-primary" data-action="${action}">${buttonText}　→</button></div></section>`}
function render(){updateChrome();const view=$('appView');if(!state.activeUser){view.innerHTML=state.view==='home'?renderUserGate():renderNoUserView();return}if(state.view==='templates'){view.innerHTML=renderTemplates();return}if(state.view==='records'){view.innerHTML=renderRecords();return}if(state.view==='reminders'){view.innerHTML=renderReminders();return}if(state.view==='backup'){view.innerHTML=renderBackup();return}view.innerHTML=renderHome()}
function renderNoUserView(){const labels={templates:['我的模板','创建本地用户后，这里才会显示你亲手建立的模板。'],records:['我的记录','创建或选择本地用户后，才能查看属于这个空间的记录。'],reminders:['提醒事项','创建本地用户后，可以在这里设置自己的提醒事项。'],backup:['数据备份','先创建或选择本地用户，才能生成和恢复这个用户的数据备份。']};const [title,copy]=labels[state.view]||['尚未进入本地空间','请先创建或选择一个本地用户。'];const isNoUser=!state.users.length;return `${shellHeader('LOCAL FIRST / USER REQUIRED',title,copy)}${emptyStage('♙',isNoUser?'未创建用户':'未选择本地用户',isNoUser?'当前浏览器还没有本地用户。先创建一个用户，再开始建立模板或提醒事项。':'当前没有选中的本地用户。返回工作台选择已有用户，或创建新的本地用户。',isNoUser?'创建本地用户':'选择本地用户',isNoUser?'new-user':'select-user',1)}`}
function renderUserGate(){if(!state.users.length)return `${shellHeader('WELCOME / FIRST SETUP','先创建你的本地用户','这里不需要联网注册。创建的只是当前浏览器里的个人资料，之后打开同一网址时，工作台会自动读取上次保存的数据。')}<section class="hero"><div class="hero-copy"><div class="hero-kicker">FUDONG CONVENIENCE STORE · PERSONAL DESK</div><h2>从一张空白桌面开始，<br><span>慢慢搭出自己的秩序。</span></h2><p>没有预置模板、任务或示例记录。第一步由你决定：先为这份本地空间取一个名字。</p></div><div class="hero-art" aria-hidden="true"><div class="hero-sign">LOCAL ONLY</div><div class="shelf"><i class="bottle"></i><i class="bottle"></i><i class="bottle"></i><i class="bottle"></i><i class="bottle"></i><i class="bottle"></i><i class="bottle"></i><i class="bottle"></i></div></div></section><section class="panel"><div class="panel-head"><div><h3>创建本地用户</h3><small>所有资料都保存在当前浏览器中</small></div><span class="status-text">STEP 01 / 03</span></div><form id="firstUserForm"><div class="form-grid"><div class="form-field"><label for="firstUserName">用户名称 *</label><input id="firstUserName" name="name" maxlength="32" required placeholder="例如：我的工作空间" autocomplete="nickname"></div><div class="form-field"><label for="firstUserAvatar">选择一个标记</label><select id="firstUserAvatar" name="avatar"><option value="🌱">🌱 小芽</option><option value="☕">☕ 咖啡</option><option value="🧋">🧋 饮品</option><option value="🎨">🎨 创作</option><option value="📚">📚 学习</option><option value="🌙">🌙 夜班</option><option value="🧸">🧸 放松</option></select></div></div><div class="modal-actions"><small style="font-size:9px;color:#8a9999">本地用户不使用密码，也不是网络账号。</small><div class="modal-actions-right"><button class="btn btn-primary" type="submit">创建本地用户　→</button></div></div></form></section>`;return `${shellHeader('LOCAL USERS / PROFILE','选择一个本地用户','检测到这个浏览器里已有本地资料。请选择要继续使用的空间，或创建另一个相互独立的本地用户。')}<section class="panel"><div class="panel-head"><h3>这个浏览器里的本地用户</h3><button class="btn btn-primary btn-small" data-action="new-user">＋ 创建新用户</button></div><div class="user-card-list">${state.users.map(user=>`<button class="user-choice" data-user-id="${esc(user.id)}"><span>${esc(user.avatar||'🌱')}</span><span style="flex:1"><strong>${esc(user.name)}</strong><small>创建于 ${fmtDate(user.createdAt)}</small></span><span>进入　→</span></button>`).join('')}</div></section>`}
function renderHome(){const templates=state.templates.length,records=state.records.length,reminders=state.reminders.length;let main;if(!templates&&!records&&!reminders){main=`<section class="panel"><div class="panel-head"><div><h3>从这里开始</h3><small>第一步没有固定答案，可以按你的习惯选择。</small></div><span class="status-text">STEP 02 / 03</span></div><div class="choice-grid"><button class="choice-card" data-action="create-template"><span class="choice-icon">▤</span><strong>创建第一个模板</strong><small>先定义以后记录内容时需要的字段。适合项目、灵感、视频或资料管理。</small><span class="btn btn-primary btn-small">创建模板　→</span></button><button class="choice-card" data-action="create-reminder"><span class="choice-icon" style="background:var(--peach-soft);color:#a86c45">◷</span><strong>创建第一份提醒事项</strong><small>先记下一件要做的事，可以设置日期时间和补充说明。</small><span class="btn btn-plain btn-small">设置提醒　→</span></button></div></section>`}else{const recent=state.records.slice(0,4);const upcoming=state.reminders.filter(x=>x.status!=='done').slice(0,3);main=`<div class="card-grid"><section class="surface-card"><h3>从模板开始</h3><p>${templates?`你已经建立 ${templates} 个模板，可以继续扩展自己的记录系统。`:'还没有模板，先定义一个适合自己的记录结构。'}</p><div style="margin-top:14px"><button class="btn btn-primary btn-small" data-action="create-template">${templates?'新建模板':'创建第一个模板'}　→</button></div></section><section class="surface-card"><h3>记下一件事</h3><p>${reminders?`当前有 ${reminders} 条提醒事项，随时可以查看或更新。`:'还没有提醒事项，可以先记下最近要做的一件事。'}</p><div style="margin-top:14px"><button class="btn btn-plain btn-small" data-action="create-reminder">${reminders?'新增提醒':'创建第一份提醒'}　→</button></div></section></div><div class="section-head" style="margin-top:23px"><div><div class="section-title">最近的记录</div><div class="section-caption">${records?`当前用户已保存 ${records} 条记录。`:'还没有记录，保存模板后就可以在这里创建。'}</div></div>${records?'<button class="btn btn-plain btn-small" data-nav="records">查看全部 →</button>':''}</div>${records?`<div class="record-list">${recent.map(recordRow).join('')}</div>`:emptyStage('▧','暂时没有记录','保存模板后，可以从模板创建自己的第一条记录。',templates?'创建第一条记录':'创建第一个模板',templates?'create-record':'create-template',3)}${upcoming.length?`<div class="section-head" style="margin-top:23px"><div><div class="section-title">待处理提醒</div></div><button class="btn btn-plain btn-small" data-nav="reminders">查看提醒 →</button></div><div class="reminder-list">${upcoming.map(reminderRow).join('')}</div>`:''}`}return `${shellHeader('YOUR DESK / PERSONAL SPACE',`欢迎回来，${esc(state.activeUser.name)}`, '本地用户已准备好。接下来可以创建模板、记录内容，或先设置一份提醒事项。',`<button class="btn btn-primary" data-action="create-template">＋ 新建模板</button>`)}<section class="hero"><div class="hero-copy"><div class="hero-kicker">FUDONG STORE · LOCAL WORKSPACE</div><h2>留一片空白，<br><span>等你定义这里。</span></h2><p>模板、记录和提醒事项都由你创建。所有修改保存在当前浏览器，下次打开同一个网址会读取上次的数据。</p></div><div class="hero-art" aria-hidden="true"><div class="hero-sign">YOUR SPACE</div><div class="shelf"><i class="bottle"></i><i class="bottle"></i><i class="bottle"></i><i class="bottle"></i><i class="bottle"></i><i class="bottle"></i><i class="bottle"></i><i class="bottle"></i></div></div></section><div class="stats"><div class="stat-card"><div class="stat-icon">♙</div><div><div class="stat-value">1</div><div class="stat-label">当前本地用户</div></div></div><div class="stat-card"><div class="stat-icon">▤</div><div><div class="stat-value">${templates}</div><div class="stat-label">自己创建的模板</div></div></div><div class="stat-card"><div class="stat-icon">▧</div><div><div class="stat-value">${records}</div><div class="stat-label">已保存的记录</div></div></div><div class="stat-card"><div class="stat-icon">◷</div><div><div class="stat-value">${reminders}</div><div class="stat-label">提醒事项</div></div></div></div>${main}<div class="footnote"><span><span class="save-dot"></span> 本地数据已载入</span><span>当前用户：${esc(state.activeUser.name)} · 不会上传到服务器</span></div>`}

function renderTemplates(){let body=state.templates.length?`<div class="card-grid">${state.templates.map(template=>`<article class="surface-card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div class="template-glyph">▤</div><div class="row-actions"><button class="icon-action" data-action="edit-template" data-id="${esc(template.id)}">编辑</button><button class="icon-action" data-action="delete-template" data-id="${esc(template.id)}">删除</button></div></div><h3 style="margin-top:13px">${esc(template.name)}</h3><p>${esc(template.description||'暂无说明')}</p><div class="card-meta"><span class="tiny-dot"></span>${(template.fields||[]).length} 个自定义字段 <span>·</span>${state.records.filter(x=>x.templateId===template.id).length} 条记录</div><div style="margin-top:13px"><button class="btn btn-plain btn-small" data-action="create-record" data-template-id="${esc(template.id)}">用此模板创建记录 →</button></div></article>`).join('')}</div>`:emptyStage('▤','还没有模板','模板是记录的空白结构。你可以决定每条记录需要哪些字段，例如日期、状态、备注或链接。','创建第一个模板','create-template',2);return `${shellHeader('TEMPLATES / BUILD YOUR OWN','我的模板','不预置任何模板。每一张模板都由你定义，可以随时编辑字段。',`<button class="btn btn-primary" data-action="create-template">＋ 创建模板</button>`)}${body}`}
function recordRow(record){const template=state.templates.find(x=>x.id===record.templateId);const subtitle=[template?.name||'模板已不存在',fmtDate(record.updatedAt||record.createdAt)].join('　·　');return `<article class="record-row"><div class="template-glyph" style="background:var(--peach-soft)">▧</div><div class="record-info"><strong>${esc(record.title||'未命名记录')}</strong><small>${esc(subtitle)}</small></div><div class="row-actions"><button class="icon-action" data-action="edit-record" data-id="${esc(record.id)}">打开</button><button class="icon-action" data-action="delete-record" data-id="${esc(record.id)}">删除</button></div></article>`}
function renderRecords(){if(!state.records.length){const hasTemplate=state.templates.length>0;return `${shellHeader('RECORDS / YOUR CONTENT','我的记录','记录是用模板填写的具体内容。没有任何预置记录，一切由你自己建立。')}${emptyStage('▧',hasTemplate?'还没有记录':'先创建一个模板','模板定义表单结构，记录保存每一次具体填写。保存后，下次打开网站时仍会在这里。',hasTemplate?'创建第一条记录':'先创建第一个模板',hasTemplate?'create-record':'create-template',hasTemplate?3:2)}`}return `${shellHeader('RECORDS / YOUR CONTENT','我的记录',`当前用户共保存 ${state.records.length} 条记录。`) }<div class="searchbar"><input id="recordSearch" placeholder="搜索记录标题、模板名或内容……" autocomplete="off"><button class="btn btn-primary" data-action="create-record">＋ 新建记录</button></div><div class="record-list" id="recordList">${state.records.map(recordRow).join('')}</div>`}
function reminderRow(reminder){const due=reminder.dueAt?fmtDateTime(reminder.dueAt):'未设置时间';return `<article class="reminder-row ${reminder.status==='done'?'done':''}"><div class="reminder-mark">${reminder.status==='done'?'✓':'◷'}</div><div class="reminder-info"><strong>${esc(reminder.title)}</strong>${reminder.note?`<p>${esc(reminder.note)}</p>`:''}<small>${esc(due)}　·　<span class="status-chip ${reminder.status==='done'?'done':''}">${reminder.status==='done'?'已完成':'待处理'}</span></small></div><div class="row-actions"><button class="icon-action" data-action="toggle-reminder" data-id="${esc(reminder.id)}">${reminder.status==='done'?'重新打开':'完成'}</button><button class="icon-action" data-action="edit-reminder" data-id="${esc(reminder.id)}">编辑</button><button class="icon-action" data-action="delete-reminder" data-id="${esc(reminder.id)}">删除</button></div></article>`}
function renderReminders(){const active=state.reminders.filter(r=>r.status!=='done'),done=state.reminders.filter(r=>r.status==='done');const content=state.reminders.length?`<div class="section-head"><div><div class="section-title">待处理事项</div><div class="section-caption">${active.length} 条待处理 · ${done.length} 条已完成</div></div><button class="btn btn-primary btn-small" data-action="create-reminder">＋ 新建提醒</button></div><div class="reminder-list">${active.map(reminderRow).join('')||'<div class="empty-inline">当前没有待处理提醒。</div>'}</div>${done.length?`<div class="section-head" style="margin-top:24px"><div><div class="section-title">已完成</div></div></div><div class="reminder-list">${done.map(reminderRow).join('')}</div>`:''}`:emptyStage('◷','还没有提醒事项','可以先写下一件要做的事，设置提醒时间，也可以暂时不设时间。内容会保存在这个浏览器里。','创建第一份提醒事项','create-reminder',2);return `${shellHeader('REMINDERS / LOCAL ONLY','提醒事项','把接下来要做的事情放在这里。提醒事项保存在本地，不会发送通知到系统桌面。',`<button class="btn btn-primary" data-action="create-reminder">＋ 新建提醒</button>`)}${content}`}
function fmtDateTime(value){if(!value)return '未设置时间';const d=new Date(value);if(Number.isNaN(d.getTime()))return String(value);return new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(d)}
function toLocalDateTimeValue(value){if(!value)return '';const d=new Date(value);if(Number.isNaN(d.getTime()))return '';const pad=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`}
function reminderModal(reminder=null){if(!state.activeUser){toast('请先创建或选择本地用户。');return}state.editingReminderId=reminder?.id||null;showModal(`<div class="modal-head"><div><h2 id="modalTitle">${reminder?'编辑提醒事项':'创建第一份提醒事项'}</h2><p>提醒只保存在当前浏览器。此版本不会在网页关闭后发送系统通知。</p></div><button class="close-button" type="button" data-action="close-modal">×</button></div><form id="reminderForm"><div class="form-grid"><div class="form-field full"><label for="reminderTitle">提醒内容 *</label><input id="reminderTitle" required maxlength="120" value="${esc(reminder?.title||'')}" placeholder="例如：整理今天的项目素材"></div><div class="form-field full"><label for="reminderDue">日期与时间（可选）</label><input id="reminderDue" type="datetime-local" value="${esc(toLocalDateTimeValue(reminder?.dueAt))}"></div><div class="form-field full"><label for="reminderNote">补充说明（可选）</label><textarea id="reminderNote" maxlength="1000" placeholder="可以写下背景、链接或准备事项">${esc(reminder?.note||'')}</textarea></div></div><div class="modal-actions"><small style="font-size:9px;color:#8a9999">保存在当前本地用户的浏览器空间中。</small><div class="modal-actions-right"><button class="btn btn-plain" type="button" data-action="close-modal">取消</button><button class="btn btn-primary" type="submit">保存提醒</button></div></div></form>`,true)}
async function saveReminder(event){event.preventDefault();if(!state.activeUser){toast('请先创建或选择本地用户。');return}const title=$('reminderTitle').value.trim();if(!title){$('reminderTitle').focus();return}const dueRaw=$('reminderDue').value;const old=state.reminders.find(r=>r.id===state.editingReminderId);const now=new Date().toISOString();const reminder={id:old?.id||uid('rem'),userId:state.activeUser.id,title,note:$('reminderNote').value.trim(),dueAt:dueRaw?new Date(dueRaw).toISOString():null,status:old?.status||'active',createdAt:old?.createdAt||now,updatedAt:now};await put('reminders',reminder);await reloadWorkspace();closeModal();state.view='reminders';render();toast(old?'提醒事项已更新。':'第一份提醒事项已保存。')}
async function deleteReminder(id){const reminder=state.reminders.find(r=>r.id===id);if(!reminder||!confirm(`确定删除提醒「${reminder.title}」吗？`))return;await remove('reminders',id);await reloadWorkspace();render();toast('提醒事项已删除。')}
async function toggleReminder(id){const reminder=state.reminders.find(r=>r.id===id);if(!reminder)return;await put('reminders',{...reminder,status:reminder.status==='done'?'active':'done',updatedAt:new Date().toISOString()});await reloadWorkspace();render();toast(reminder.status==='done'?'提醒事项已重新打开。':'提醒事项已标记完成。')}
function renderBackup(){const options=[['0','关闭自动备份'],['3600000','每 1 小时'],['21600000','每 6 小时'],['86400000','每天'],['604800000','每 7 天']];const selected=Number(state.settings?.autoBackupIntervalMs||0);const history=state.backups.length?`<div class="backup-history">${state.backups.slice(0,8).map(b=>`<div class="backup-item"><div><strong>${b.automatic?'自动备份':'手动快照'} · ${esc(fmtDateTime(b.createdAt))}</strong><small>${(b.payload?.templates||[]).length} 个模板 · ${(b.payload?.records||[]).length} 条记录 · ${(b.payload?.reminders||[]).length} 条提醒</small></div><button class="btn btn-plain btn-small" data-action="download-backup" data-id="${esc(b.id)}">下载文件</button></div>`).join('')}</div>`:'<div class="empty-inline">还没有自动备份快照。启用自动备份后，会先创建一份本地快照。</div>';return `${shellHeader('DATA / LOCAL BACKUP','数据备份','在当前浏览器里保留可恢复的备份快照，也可以随时下载 JSON 文件放到电脑上。')}<div class="card-grid"><section class="surface-card"><div class="template-glyph" style="background:var(--mint-soft)">⇩</div><h3 style="margin-top:13px">下载当前数据</h3><p>导出当前用户的模板、记录、提醒事项和备份设置，不包含其他本地用户的数据。</p><div style="margin-top:15px"><button class="btn btn-primary" data-action="export">下载 JSON 备份</button></div></section><section class="surface-card"><div class="template-glyph" style="background:var(--blue-soft)">⇧</div><h3 style="margin-top:13px">从备份恢复</h3><p>导入以前下载的 JSON 文件。恢复前会请求确认，并替换当前用户的模板、记录和提醒事项。</p><div style="margin-top:15px"><button class="btn btn-plain" data-action="import">选择 JSON 文件</button></div></section></div><section class="surface-card" style="margin-top:14px"><div class="template-glyph" style="background:var(--peach-soft)">◷</div><h3 style="margin-top:13px">自动备份周期</h3><p>自动备份会在当前浏览器里生成本地快照；到达设定时长后，如果网页处于关闭状态，会在下一次打开或切回页面时补做。浏览器不会在后台替网页定时下载文件。</p><div class="backup-setting"><label for="backupIntervalSelect">选择备份频率</label><select id="backupIntervalSelect">${options.map(([value,label])=>`<option value="${value}" ${selected===Number(value)?'selected':''}>${label}</option>`).join('')}</select><div><button class="btn btn-primary btn-small" data-action="save-backup-settings">保存备份设置</button><button class="btn btn-plain btn-small" style="margin-left:6px" data-action="backup-now">立即创建快照</button></div></div><div class="backup-note">自动快照存放在当前浏览器的 IndexedDB 里，最近保留 10 份。你可以在下方单独下载每一份备份文件；如需防止清除网站数据导致丢失，请把文件保存到电脑或其他安全位置。</div><div class="section-head" style="margin-top:22px"><div><div class="section-title">本地备份历史</div><div class="section-caption">最近一次自动备份：${state.settings?.lastAutoBackupAt?esc(fmtDateTime(state.settings.lastAutoBackupAt)):'尚未创建'}</div></div></div>${history}</section><section class="surface-card" style="margin-top:14px"><div class="template-glyph" style="background:var(--purple-soft)">ⓘ</div><h3 style="margin-top:13px">本地存储说明</h3><p>数据保存在当前浏览器，不会发送到服务器。同一浏览器打开同一网址时会继续上次数据；换浏览器、换设备、使用无痕窗口或清除网站数据后不会自动带过去。</p><div class="card-meta"><span class="tiny-dot"></span>IndexedDB · 本机存储</div></section>`}
function fieldRows(fields){return (fields||[]).map(field=>fieldRow(field.label,field.type,field.required,field.id)).join('')}
function fieldRow(label='',type='text',required=false,id=''){return `<div class="field-row" data-field-id="${esc(id||'')}"><input class="field-label-input" maxlength="50" value="${esc(label)}" placeholder="字段名称，例如：截止日期" aria-label="字段名称"><select class="field-type-input" aria-label="字段类型"><option value="text" ${type==='text'?'selected':''}>短文本</option><option value="textarea" ${type==='textarea'?'selected':''}>长文本</option><option value="date" ${type==='date'?'selected':''}>日期</option><option value="number" ${type==='number'?'selected':''}>数字</option><option value="checkbox" ${type==='checkbox'?'selected':''}>是 / 否</option></select><button class="remove-field" type="button" data-action="remove-field" aria-label="移除字段">×</button></div>`}
function templateModal(template=null){state.editingTemplateId=template?.id||null;showModal(`<div class="modal-head"><div><h2 id="modalTitle">${template?'编辑模板':'创建一个空白模板'}</h2><p>模板只定义结构，不会自动生成记录。字段可以按需要增减。</p></div><button class="close-button" type="button" data-action="close-modal" aria-label="关闭">×</button></div><form id="templateForm"><div class="form-grid"><div class="form-field full"><label for="templateName">模板名称 *</label><input id="templateName" maxlength="80" required value="${esc(template?.name||'')}" placeholder="例如：项目记录、视频制作、灵感收集"></div><div class="form-field full"><label for="templateDescription">用途说明（可选）</label><textarea id="templateDescription" maxlength="500" placeholder="这个模板用来记录什么？">${esc(template?.description||'')}</textarea></div><div class="form-field full"><label>自定义字段</label><small>你也可以暂时不加字段，先建立一个最简单的模板。每条记录都会有一个标题。</small><div class="field-builder" id="fieldBuilder">${fieldRows(template?.fields||[])}</div><div style="margin-top:9px"><button class="btn btn-plain btn-small" type="button" data-action="add-field">＋ 添加字段</button></div></div></div><div class="modal-actions"><small style="font-size:9px;color:#8a9999">保存后会立即写入浏览器本地数据库。</small><div class="modal-actions-right"><button class="btn btn-plain" type="button" data-action="close-modal">取消</button><button class="btn btn-primary" type="submit">${template?'保存修改':'创建模板'}</button></div></div></form>`,true)}
function collectFields(){const rows=[...document.querySelectorAll('#fieldBuilder .field-row')];const seen=new Set();return rows.map(row=>({id:row.dataset.fieldId||uid('field'),label:row.querySelector('.field-label-input').value.trim(),type:row.querySelector('.field-type-input').value,required:false})).filter(field=>{if(!field.label||seen.has(field.label))return false;seen.add(field.label);return true})}
function templatePickerModal(){showModal(`<div class="modal-head"><div><h2 id="modalTitle">选择记录模板</h2><p>选择一个模板来填写新的记录。</p></div><button class="close-button" type="button" data-action="close-modal">×</button></div><div class="user-card-list">${state.templates.map(template=>`<button class="user-choice" data-action="choose-record-template" data-id="${esc(template.id)}"><span>▤</span><span style="flex:1"><strong>${esc(template.name)}</strong><small>${(template.fields||[]).length} 个自定义字段 · ${esc(template.description||'暂无说明')}</small></span><span>选择 →</span></button>`).join('')}</div>`,false)}
function recordModal(templateId,record=null){const template=state.templates.find(x=>x.id===templateId);if(!template){toast('请先创建一个模板。');return}state.editingRecordId=record?.id||null;state.activeTemplateForRecord=templateId;const data=record?.data||{};const fieldHTML=(template.fields||[]).map(field=>{const value=data[field.id]??'';const id=`recordField_${field.id}`;let control;if(field.type==='textarea')control=`<textarea id="${id}" data-field-id="${esc(field.id)}" placeholder="填写${esc(field.label)}……">${esc(value)}</textarea>`;else if(field.type==='checkbox')control=`<select id="${id}" data-field-id="${esc(field.id)}"><option value="false" ${value===false||value==='false'||value===''?'selected':''}>否</option><option value="true" ${value===true||value==='true'?'selected':''}>是</option></select>`;else control=`<input id="${id}" data-field-id="${esc(field.id)}" type="${field.type==='date'?'date':field.type==='number'?'number':'text'}" value="${esc(value)}" placeholder="填写${esc(field.label)}……">`;return `<div class="form-field ${field.type==='textarea'?'full':''}"><label for="${id}">${esc(field.label)}</label>${control}</div>`}).join('');showModal(`<div class="modal-head"><div><h2 id="modalTitle">${record?'编辑记录':'新建记录'}</h2><p>使用模板「${esc(template.name)}」创建内容。提交后会保存在当前本地用户下。</p></div><button class="close-button" type="button" data-action="close-modal" aria-label="关闭">×</button></div><form id="recordForm"><div class="form-grid"><div class="form-field full"><label for="recordTitle">记录标题 *</label><input id="recordTitle" required maxlength="120" value="${esc(record?.title||'')}" placeholder="给这条记录起一个容易识别的名字"></div>${fieldHTML||'<div class="form-field full"><small>这个模板没有自定义字段。你可以直接保存标题，也可以稍后编辑模板添加字段。</small></div>'}</div><div class="modal-actions"><small style="font-size:9px;color:#8a9999">模板：${esc(template.name)}</small><div class="modal-actions-right"><button class="btn btn-plain" type="button" data-action="close-modal">取消</button><button class="btn btn-primary" type="submit">保存记录</button></div></div></form>`,true)}
function buildBackupPayload(){return {app:'fudong-store-workbench',schemaVersion:2,exportedAt:new Date().toISOString(),user:{name:state.activeUser.name,avatar:state.activeUser.avatar,createdAt:state.activeUser.createdAt},templates:state.templates,records:state.records,reminders:state.reminders,settings:{autoBackupIntervalMs:Number(state.settings?.autoBackupIntervalMs||0)}}}
function downloadBackupPayload(data,filename){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportBackup(){if(!state.activeUser){toast('请先创建或选择本地用户。');return}const data=buildBackupPayload();downloadBackupPayload(data,`符冬便利店_${state.activeUser.name}_备份_${localDate()}.json`);toast('JSON 备份文件已开始下载。')}
async function trimBackupHistory(userId,keep=10){const all=(await allFrom('backups')).filter(x=>x.userId===userId).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));for(const item of all.slice(keep))await remove('backups',item.id)}
async function createBackupSnapshot({automatic=true,force=false,silent=false}={}){if(!state.activeUser||state.backupBusy)return false;state.backupBusy=true;try{const now=new Date().toISOString();const payload=buildBackupPayload();const snapshot={id:uid('bak'),userId:state.activeUser.id,createdAt:now,automatic,payload};await put('backups',snapshot);const settings={...(state.settings||{}),userId:state.activeUser.id,lastBackupAt:now,...(automatic?{lastAutoBackupAt:now}:{}),updatedAt:now};await put('settings',settings);await trimBackupHistory(state.activeUser.id,10);await reloadWorkspace();if(state.view==='backup')render();if(!silent)toast(automatic?'自动备份快照已保存到浏览器。':'本地备份快照已创建，可在下方下载。');return true}catch(error){if(!silent)toast(`创建备份失败：${error.message||'本地存储不可用'}`);return false}finally{state.backupBusy=false}}
async function maybeAutoBackup(){if(!state.activeUser||state.backupBusy)return;const interval=Number(state.settings?.autoBackupIntervalMs||0);if(!interval)return;const base=state.settings?.lastAutoBackupAt||state.settings?.autoBackupStartedAt||state.activeUser.createdAt;const baseTime=base?new Date(base).getTime():Date.now();if(!Number.isFinite(baseTime)||Date.now()-baseTime>=interval)await createBackupSnapshot({automatic:true,force:false,silent:true})}
async function saveBackupSettings(){if(!state.activeUser){toast('请先创建或选择本地用户。');return}const select=$('backupIntervalSelect');if(!select)return;const interval=Number(select.value)||0;const old=state.settings||{userId:state.activeUser.id,autoBackupIntervalMs:0,lastBackupAt:null};const wasEnabled=Number(old.autoBackupIntervalMs||0)>0;const now=new Date().toISOString();state.settings={...old,userId:state.activeUser.id,autoBackupIntervalMs:interval,autoBackupStartedAt:interval?(wasEnabled?old.autoBackupStartedAt||now:now):null,updatedAt:now};await put('settings',state.settings);if(interval>0&&!wasEnabled){await createBackupSnapshot({automatic:true,force:true,silent:true});render();toast('已启用自动备份，并创建了第一份本地快照。')}else{await reloadWorkspace();render();toast(interval?'自动备份周期已更新。':'自动备份已关闭。')}}
async function downloadSavedBackup(id){const snapshot=state.backups.find(x=>x.id===id);if(!snapshot){toast('找不到这份备份，请刷新页面后重试。');return}downloadBackupPayload(snapshot.payload,`符冬便利店_${state.activeUser.name}_本地备份_${String(snapshot.createdAt||localDate()).replace(/[:.]/g,'-')}.json`);toast('备份文件已开始下载。')}
function startBackupScheduler(){if(state.backupTimer)clearInterval(state.backupTimer);state.backupTimer=setInterval(()=>{maybeAutoBackup().catch(()=>{})},60000);if(!state.backupVisibilityBound){document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')maybeAutoBackup().catch(()=>{})});window.addEventListener('focus',()=>maybeAutoBackup().catch(()=>{}));state.backupVisibilityBound=true}}
function switchUserModal(){showModal(`<div class="modal-head"><div><h2 id="modalTitle">切换本地用户</h2><p>每个本地用户都拥有独立的模板和记录。</p></div><button class="close-button" type="button" data-action="close-modal">×</button></div><div class="user-card-list">${state.users.map(user=>`<button class="user-choice" data-action="switch-user" data-id="${esc(user.id)}"><span>${esc(user.avatar||'🌱')}</span><span style="flex:1"><strong>${esc(user.name)}${user.id===state.activeUser?.id?'（当前）':''}</strong><small>本地空间 · 创建于 ${fmtDate(user.createdAt)}</small></span><span>进入 →</span></button>`).join('')}</div><div class="modal-actions"><button class="btn btn-plain" type="button" data-action="new-user">＋ 创建新用户</button><div class="modal-actions-right"><button class="btn btn-plain" type="button" data-action="close-modal">取消</button></div></div>`,false)}
async function createUser(name,avatar){const user={id:uid('user'),name:name.trim(),avatar:avatar||'🌱',createdAt:new Date().toISOString()};await put('users',user);await put('settings',{userId:user.id,autoBackupIntervalMs:0,lastBackupAt:null,autoBackupStartedAt:null,updatedAt:new Date().toISOString()});state.activeUser=user;rememberUserId(user.id);await reloadUsers();await reloadWorkspace();state.view='home';closeModal();render();startBackupScheduler();toast('本地用户已创建。请选择创建第一个模板，或设置第一份提醒事项。')}
async function activateUser(id){const user=state.users.find(x=>x.id===id);if(!user)return;state.activeUser=user;rememberUserId(user.id);await reloadWorkspace();if(!state.settings) {state.settings={userId:id,autoBackupIntervalMs:0,lastBackupAt:null,autoBackupStartedAt:null};await put('settings',state.settings)}state.view='home';closeModal();render();startBackupScheduler();await maybeAutoBackup();toast(`已进入「${user.name}」的本地空间。`)}
async function saveTemplate(event){event.preventDefault();const name=$('templateName').value.trim();if(!name){$('templateName').focus();return}const now=new Date().toISOString();const fields=collectFields();const old=state.templates.find(t=>t.id===state.editingTemplateId);const template={id:old?.id||uid('tpl'),userId:state.activeUser.id,name,description:$('templateDescription').value.trim(),fields,createdAt:old?.createdAt||now,updatedAt:now};await put('templates',template);await reloadWorkspace();closeModal();state.view='templates';render();toast(old?'模板已更新。':'第一个模板已创建，可以用它新增记录啦！')}
async function saveRecord(event){event.preventDefault();const title=$('recordTitle').value.trim();if(!title){$('recordTitle').focus();return}const template=state.templates.find(t=>t.id===state.activeTemplateForRecord);if(!template){toast('模板不存在，请重新选择。');return}const data={};document.querySelectorAll('[data-field-id]').forEach(el=>{data[el.dataset.fieldId]=el.tagName==='SELECT'&&el.value==='true'?true:el.tagName==='SELECT'&&el.value==='false'?false:el.value});const old=state.records.find(r=>r.id===state.editingRecordId);const now=new Date().toISOString();const record={id:old?.id||uid('rec'),userId:state.activeUser.id,templateId:template.id,title,data,createdAt:old?.createdAt||now,updatedAt:now};await put('records',record);await reloadWorkspace();closeModal();state.view='records';render();toast(old?'记录已更新并保存。':'第一条记录已保存。下次打开时还会在这里。')}
async function deleteTemplate(id){const template=state.templates.find(t=>t.id===id);if(!template)return;const linked=state.records.filter(r=>r.templateId===id).length;if(linked&&!confirm(`模板「${template.name}」关联了 ${linked} 条记录。删除模板会一并删除这些记录，确定继续吗？`))return;if(!linked&&!confirm(`确定删除模板「${template.name}」吗？`))return;await new Promise((resolve,reject)=>{const transaction=state.db.transaction(['templates','records'],'readwrite');transaction.objectStore('templates').delete(id);const cursor=transaction.objectStore('records').index('templateId').openCursor(IDBKeyRange.only(id));cursor.onsuccess=()=>{const current=cursor.result;if(current){current.delete();current.continue()}};transaction.oncomplete=resolve;transaction.onerror=()=>reject(transaction.error)});await reloadWorkspace();render();toast('模板及其关联记录已删除。')}
async function deleteRecord(id){const record=state.records.find(r=>r.id===id);if(!record||!confirm(`确定删除记录「${record.title}」吗？`))return;await remove('records',id);await reloadWorkspace();render();toast('记录已删除。')}
async function importBackup(file){if(!state.activeUser){toast('请先创建或选择本地用户。');return}try{const parsed=JSON.parse(await file.text());if(parsed.app!=='fudong-store-workbench'||![1,2].includes(parsed.schemaVersion)||!Array.isArray(parsed.templates)||!Array.isArray(parsed.records))throw new Error('这不是受支持的符冬便利店备份文件。');const reminders=Array.isArray(parsed.reminders)?parsed.reminders:[];const ok=confirm(`将用备份中的 ${parsed.templates.length} 个模板、${parsed.records.length} 条记录和 ${reminders.length} 条提醒替换当前用户「${state.activeUser.name}」的全部业务数据。建议先下载当前备份。继续吗？`);if(!ok)return;const userId=state.activeUser.id;const templates=parsed.templates.filter(t=>t&&typeof t.id==='string'&&typeof t.name==='string').map(t=>({...t,userId}));const validTemplateIds=new Set(templates.map(t=>t.id));const records=parsed.records.filter(r=>r&&typeof r.id==='string'&&typeof r.title==='string'&&validTemplateIds.has(r.templateId)).map(r=>({...r,userId}));const validReminders=reminders.filter(r=>r&&typeof r.id==='string'&&typeof r.title==='string').map(r=>({...r,userId,status:r.status==='done'?'done':'active'}));await deleteUserData(userId);await new Promise((resolve,reject)=>{const transaction=state.db.transaction(['templates','records','reminders','settings'],'readwrite');for(const t of templates)transaction.objectStore('templates').put(t);for(const r of records)transaction.objectStore('records').put(r);for(const r of validReminders)transaction.objectStore('reminders').put(r);const current=state.settings||{userId,autoBackupIntervalMs:0,lastBackupAt:null};transaction.objectStore('settings').put({...current,autoBackupIntervalMs:parsed.settings?Number(parsed.settings.autoBackupIntervalMs||0):Number(current.autoBackupIntervalMs||0),autoBackupStartedAt:parsed.settings&&Number(parsed.settings.autoBackupIntervalMs||0)>0?(current.autoBackupStartedAt||new Date().toISOString()):null,userId,updatedAt:new Date().toISOString()});transaction.oncomplete=resolve;transaction.onerror=()=>reject(transaction.error)});await reloadWorkspace();render();toast('备份恢复完成。')}catch(error){toast(`导入失败：${error.message||'文件格式不正确'}`)}finally{$('importFile').value=''}}
function performAction(target){const action=target.dataset.action;const id=target.dataset.id;if(!action)return;if(action==='close-modal')return closeModal();if(action==='new-user'){closeModal();renderUserCreationModal();return}if(action==='select-user'){state.view='home';render();return}if(action==='switch-user')return activateUser(id);if(action==='choose-record-template'){closeModal();return recordModal(id)}if(action==='create-template'||action==='edit-template'||action==='delete-template'||action==='create-record'||action==='edit-record'||action==='delete-record'||action==='create-reminder'||action==='edit-reminder'||action==='delete-reminder'||action==='toggle-reminder'||action==='export'||action==='import'||action==='save-backup-settings'||action==='backup-now'||action==='download-backup'||action==='add-field'||action==='remove-field'){if(!state.activeUser){toast('请先创建或选择本地用户。');state.view='home';render();return}}if(action==='create-template')return templateModal();if(action==='edit-template')return templateModal(state.templates.find(t=>t.id===id));if(action==='delete-template')return deleteTemplate(id);if(action==='add-field'){const builder=$('fieldBuilder');if(builder)builder.insertAdjacentHTML('beforeend',fieldRow());return}if(action==='remove-field'){target.closest('.field-row')?.remove();return}if(action==='create-record'){const templateId=target.dataset.templateId;if(!state.templates.length){toast('先创建第一个模板，再创建记录。');state.view='templates';render();return}if(templateId)return recordModal(templateId);if(state.templates.length===1)return recordModal(state.templates[0].id);return templatePickerModal()}if(action==='edit-record'){const record=state.records.find(r=>r.id===id);return recordModal(record?.templateId,record)}if(action==='delete-record')return deleteRecord(id);if(action==='create-reminder')return reminderModal();if(action==='edit-reminder')return reminderModal(state.reminders.find(r=>r.id===id));if(action==='delete-reminder')return deleteReminder(id);if(action==='toggle-reminder')return toggleReminder(id);if(action==='export')return exportBackup();if(action==='import')return $('importFile').click();if(action==='save-backup-settings')return saveBackupSettings();if(action==='backup-now')return createBackupSnapshot({automatic:false,force:true});if(action==='download-backup')return downloadSavedBackup(id)}
function renderUserCreationModal(){showModal(`<div class="modal-head"><div><h2 id="modalTitle">创建本地用户</h2><p>本地资料只用于区分当前浏览器里的工作空间，无需密码或网络注册。</p></div><button class="close-button" type="button" data-action="close-modal">×</button></div><form id="newUserForm"><div class="form-grid"><div class="form-field full"><label for="newUserName">用户名称 *</label><input id="newUserName" maxlength="32" required placeholder="给本地空间取个名字"></div><div class="form-field full"><label for="newUserAvatar">空间标记</label><select id="newUserAvatar"><option value="🌱">🌱 小芽</option><option value="☕">☕ 咖啡</option><option value="🧋">🧋 饮品</option><option value="🎨">🎨 创作</option><option value="📚">📚 学习</option><option value="🌙">🌙 夜班</option><option value="🧸">🧸 放松</option></select></div></div><div class="modal-actions"><small style="font-size:9px;color:#8a9999">新用户拥有独立的模板和记录。</small><div class="modal-actions-right"><button class="btn btn-plain" type="button" data-action="close-modal">取消</button><button class="btn btn-primary" type="submit">创建并进入</button></div></div></form>`)}
function bindEvents(){document.addEventListener('click',event=>{const actionTarget=event.target.closest('[data-action]');if(actionTarget){event.preventDefault();performAction(actionTarget);return}const nav=event.target.closest('[data-nav]');if(nav){state.view=nav.dataset.nav;render();return}const view=event.target.closest('[data-view]');if(view){state.view=view.dataset.view;render();return}const choice=event.target.closest('[data-user-id]');if(choice){activateUser(choice.dataset.userId);return}});$('userSwitch').addEventListener('click',()=>{if(!state.users.length){render();return}switchUserModal()});$('modalOverlay').addEventListener('click',event=>{if(event.target===$('modalOverlay'))closeModal()});document.addEventListener('keydown',event=>{if(event.key==='Escape')closeModal()});$('appView').addEventListener('submit',async event=>{if(event.target.id==='firstUserForm'){event.preventDefault();try{await createUser($('firstUserName').value,$('firstUserAvatar').value)}catch(error){toast(`创建失败：${error.message}`)}return}if(event.target.id==='templateForm'){try{await saveTemplate(event)}catch(error){toast(`保存模板失败：${error.message}`)}return}if(event.target.id==='reminderForm'){try{await saveReminder(event)}catch(error){toast(`保存提醒失败：${error.message}`)}return}});$('modalContent').addEventListener('submit',async event=>{if(event.target.id==='newUserForm'){event.preventDefault();try{await createUser($('newUserName').value,$('newUserAvatar').value)}catch(error){toast(`创建用户失败：${error.message}`)}return}if(event.target.id==='templateForm'){try{await saveTemplate(event)}catch(error){toast(`保存模板失败：${error.message}`)}return}if(event.target.id==='recordForm'){try{await saveRecord(event)}catch(error){toast(`保存记录失败：${error.message}`)}return}if(event.target.id==='reminderForm'){try{await saveReminder(event)}catch(error){toast(`保存提醒失败：${error.message}`)}return}});$('appView').addEventListener('input',event=>{if(event.target.id==='recordSearch'){const q=event.target.value.trim().toLowerCase();const list=$('recordList');if(list)list.innerHTML=state.records.filter(record=>{const template=state.templates.find(t=>t.id===record.templateId);return `${record.title} ${template?.name||''} ${JSON.stringify(record.data||{})}`.toLowerCase().includes(q)}).map(recordRow).join('')||'<div class="empty-inline">没有找到匹配的记录。</div>'}});$('importFile').addEventListener('change',event=>{const file=event.target.files?.[0];if(file)importBackup(file)})}
async function bootstrap(){bindEvents();try{state.db=await openDB();await reloadUsers();const stored=getRememberedUserId();state.activeUser=state.users.find(user=>user.id===stored)||null;if(state.activeUser){await reloadWorkspace();state.view='home'}else{state.view='home'}render();startBackupScheduler();if(state.activeUser){await maybeAutoBackup();toast(`已从浏览器读取「${state.activeUser.name}」的上次数据。`)} }catch(error){$('appView').innerHTML=`<section class="empty-stage"><div class="empty-content"><div class="empty-icon">!</div><h3>无法打开本地数据库</h3><p>${esc(error.message||'当前浏览器无法使用 IndexedDB。')}<br>请使用常见的现代浏览器，并通过固定的网站地址访问。</p><button class="btn btn-primary" onclick="location.reload()">重新尝试</button></div></section>`}}
bootstrap();
})();
