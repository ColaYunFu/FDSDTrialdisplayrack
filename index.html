function randomBytes(length){const bytes=new Uint8Array(length);crypto.getRandomValues(bytes);return bytes}

async function derivePinBits(pin,salt,iterations=180000){if(!crypto?.subtle)throw new Error('当前浏览器不支持安全加密，请使用最新版本的 Chrome、Edge 或 Firefox。');const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(String(pin)),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations,hash:'SHA-256'},material,256))}

async function imageFileToAvatar(file){if(!file)return null;if(!file.type.startsWith('image/')||file.type==='image/svg+xml')throw new Error('请选择 PNG、JPEG、WebP 或 GIF 等图片文件。');if(file.size>8*1024*1024)throw new Error('头像原图不能超过 8 MB。');const url=URL.createObjectURL(file);try{const image=new Image();image.src=url;await image.decode();const scale=Math.min(1,256/Math.max(image.naturalWidth,image.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));const ctx=canvas.getContext('2d');ctx.drawImage(image,0,0,canvas.width,canvas.height);let result=canvas.toDataURL('image/webp',.82);if(!result.startsWith('data:image/webp'))result=canvas.toDataURL('image/jpeg',.82);return result}finally{URL.revokeObjectURL(url)}}

const fmtDate=value=>{if(!value)return '未设置日期';const d=new Date(/^\d{4}-\d{2}-\d{2}$/.test(String(value))?`${value}T00:00:00`:value);return Number.isNaN(d.getTime())?String(value):new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'short',day:'numeric'}).format(d)};
function fmtDateTime(value){if(!value)return '未设置时间';const d=new Date(value);if(Number.isNaN(d.getTime()))return String(value);return new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(d)}
function toLocalDateTimeValue(value){if(!value)return '';const d=new Date(value);if(Number.isNaN(d.getTime()))return '';const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>el.classList.remove('show'),2800)}
function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window)){reject(new Error('当前浏览器不支持 IndexedDB'));return}const request=indexedDB.open(DB_NAME,DB_VERSION);request.onupgradeneeded=()=>{const db=request.result;const transaction=request.transaction;const ensure=(name,keyPath,indexes=[])=>{const store=db.objectStoreNames.contains(name)?transaction.objectStore(name):db.createObjectStore(name,{keyPath});for(const [indexName,path] of indexes)if(!store.indexNames.contains(indexName))store.createIndex(indexName,path,{unique:false})};ensure('users','id',[['createdAt','createdAt']]);ensure('projects','id',[['userId','userId'],['status','status'],['updatedAt','updatedAt']]);ensure('templates','id',[['userId','userId'],['updatedAt','updatedAt']]);ensure('records','id',[['userId','userId'],['templateId','templateId'],['updatedAt','updatedAt']]);ensure('reminders','id',[['userId','userId'],['dueAt','dueAt'],['updatedAt','updatedAt'],['projectId','projectId']]);ensure('settings','userId');ensure('backups','id',[['userId','userId'],['createdAt','createdAt']])};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error||new Error('无法打开本地数据库'));request.onblocked=()=>reject(new Error('本地数据库正在被另一个页面占用，请关闭其他工作台标签后重试'))})}
function tx(storeNames,mode,executor){return new Promise((resolve,reject)=>{const transaction=state.db.transaction(storeNames,mode);let result;try{result=executor(transaction)}catch(error){reject(error);return}transaction.oncomplete=()=>resolve(result);transaction.onerror=()=>reject(transaction.error||new Error('本地数据写入失败'));transaction.onabort=()=>reject(transaction.error||new Error('本地事务已取消'))})}
function req(request){return new Promise((resolve,reject)=>{request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error||new Error('本地数据读取失败'))})}
async function allFrom(name){return req(state.db.transaction([name],'readonly').objectStore(name).getAll())}
async function put(name,value){await tx([name],'readwrite',t=>t.objectStore(name).put(value))}
async function remove(name,id){await tx([name],'readwrite',t=>t.objectStore(name).delete(id))}
async function reloadUsers(){state.users=(await allFrom('users')).sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''))}
async function reloadWorkspace(){if(!state.activeUser){state.projects=[];state.templates=[];state.records=[];state.reminders=[];state.settings=null;state.backups=[];return}const userId=state.activeUser.id;const [projects,templates,records,reminders,settings,backups]=await Promise.all([allFrom('projects'),allFrom('templates'),allFrom('records'),allFrom('reminders'),req(state.db.transaction(['settings'],'readonly').objectStore('settings').get(userId)),allFrom('backups')]);state.projects=projects.filter(x=>x.userId===userId).sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));state.templates=templates.filter(x=>x.userId===userId);state.records=records.filter(x=>x.userId===userId);state.reminders=reminders.filter(x=>x.userId===userId).sort((a,b)=>{if(a.status!==b.status)return a.status==='done'?1:-1;return (a.dueAt||'9999').localeCompare(b.dueAt||'9999')});state.settings=settings||{userId,autoBackupIntervalMs:0,lastBackupAt:null,autoBackupStartedAt:null};state.backups=backups.filter(x=>x.userId===userId).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')).slice(0,10)}

function renderCalendar(){const cursor=state.calendarCursor;const year=cursor.getFullYear(),month=cursor.getMonth();const first=new Date(year,month,1);const offset=(first.getDay()+6)%7;const start=new Date(year,month,1-offset);const days=['一','二','三','四','五','六','日'];let cells='';for(let i=0;i<42;i++){const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);const key=localDate(d);const inMonth=d.getMonth()===month;const dayItems=state.reminders.filter(r=>r.status!=='done'&&r.dueAt&&localDate(new Date(r.dueAt))===key);cells+=`<button class="calendar-day ${inMonth?'':'outside'} ${key===localDate()?'today':''} ${key===state.selectedDate?'selected':''}" data-action="select-day" data-date="${key}" aria-label="${key}，${dayItems.length} 条待办"><span class="day-number">${d.getDate()}</span><span class="day-dots">${dayItems.slice(0,3).map(r=>`<i class="day-dot ${isOverdue(r)?'overdue':''}"></i>`).join('')}</span></button>`}const selected=reminderForDay(state.selectedDate);const selectedAll=state.reminders.filter(r=>r.dueAt&&localDate(new Date(r.dueAt))===state.selectedDate).sort((a,b)=>(a.dueAt||'').localeCompare(b.dueAt||''));const agenda=selectedAll.length?`<div class="reminder-list">${selectedAll.map(reminderRow).join('')}</div>`:`<div class="empty-mini">这一天还没有安排提醒。<br><button class="btn btn-plain btn-small" style="margin-top:8px" data-action="create-reminder">＋ 为这一天添加提醒</button></div>`;return `<section class="surface-card calendar-panel"><div class="calendar-toolbar"><div><div class="section-title">时间日历</div><div class="section-caption">点选日期查看当天安排 · ${selected.length} 条待处理</div></div><div class="calendar-arrows"><button class="icon-action" data-action="calendar-prev" aria-label="上个月">‹</button><button class="icon-action" data-action="calendar-today">今天</button><button class="icon-action" data-action="calendar-next" aria-label="下个月">›</button></div></div><div class="calendar-toolbar"><div class="calendar-month">${new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long'}).format(cursor)}</div><span class="date-badge">${state.selectedDate}</span></div><div class="calendar-grid">${days.map(x=>`<div class="calendar-weekday">${x}</div>`).join('')}${cells}</div><div class="agenda-head"><div class="agenda-date">${fmtDate(state.selectedDate)} · 当日安排</div><span class="agenda-count">${selectedAll.length} 条</span></div>${agenda}</section>`}

class="hero-sign">TODAY / ${localDate()}</div><div class="shelf"><i class="bottle"></i><i class="bottle"></i><i class="bottle"></i><i class="bottle"></i><i class="bottle"></i><i class="bottle"></i><i class="bottle"></i><i class="bottle"></i></div></div></section><div class="stats"><div class="stat-card"><div class="stat-icon">▦</div><div><div class="stat-value">${state.projects.length}</div><div class="stat-label">项目总数</div></div></div><div class="stat-card"><div class="stat-icon">◷</div><div><div class="stat-value">${active.length}</div><div class="stat-label">待处理提醒</div></div></div><div class="stat-card"><div class="stat-icon">☀</div><div><div class="stat-value">${dueToday}</div><div class="stat-label">今日到期</div></div></div><div class="stat-card"><div class="stat-icon">!</div><div><div class="stat-value">${overdue}</div><div class="stat-label">已逾期</div></div></div></div>${onboarding}<div class="overview-layout"><div>${renderCalendar()}</div><div class="overview-side"><section class="surface-card"><div class="section-head"><div><div class="section-title">即将到期</div><div class="section-caption">按时间排列的待处理事项</div></div><button class="btn btn-plain btn-small" data-view="reminders">全部提醒 →</button></div><div class="overview-list">${upcoming.length?upcoming.map(miniReminder).join(''):'<div class="empty-mini"><strong>暂时没有即将到期的提醒</strong>你可以从这里开始安排下一件事。<br><button class="btn btn-plain btn-small" style="margin-top:9px" data-action="create-reminder">＋ 新建提醒</button></div>'}</div></section><section class="surface-card"><div class="section-head"><div><div class="section-title">提醒事项进度</div><div class="section-caption">已完成 ${done.length} 条</div></div><button class="btn btn-plain btn-small" data-view="reminders">查看总览 →</button></div><div class="project-stats"><span class="project-stat">待处理 ${active.length}</span><span class="project-stat">今日 ${dueToday}</span><span class="project-stat">逾期 ${overdue}</span></div></section></div></div><section class="surface-card" style="margin-top:18 async function completeEncryptedImport(pin){if(Date.now()<state.pinBlockedUntil)throw new Error(`尝试次数过多，请 ${Math.ceil((state.pinBlockedUntil-Date.now())/1000)} 秒后重试。`);if(!validPin(pin))throw new Error('请输入 4 位 PIN。');const file=state.pendingImportFile;if(!file)throw new Error('没有待恢复的备份文件。');const envelope=JSON.parse(await file.text());let payload;try{payload=await decryptBackupEnvelope(envelope,pin);state.pinAttempts=0;state.pinBlockedUntil=0}catch(error){state.pinAttempts++;if(state.pinAttempts>=5){state.pinAttempts=0;state.pinBlockedUntil=Date.now()+30000}throw error}if(!confirm(`验证成功。将导入账户「${payload.user.name}」，创建一个新的本地用户，并恢复 ${payload.projects.length} 个项目、${payload.reminders.length} 条提醒事项。不会覆盖现有用户。继续吗？`))return;let name=String(payload.user.name||'导入的本地账户').trim()||'导入的本地账户';if(state.users.some(u=>u.name.toLowerCase()===name.toLowerCase())){let suffix=2;while(state.users.some(u=>u.name.toLowerCase()===`${name}（导入${suffix}）`.toLowerCase()))suffix++;name=`${name}（导入${suffix}）`}const credentials=await createPinCredentials(pin);const user={id:uid('user'),name,avatar:payload.user.avatar||'🌱',createdAt:new Date().toISOString(),...credentials};const newProjects=payload.projects.filter(p=>p&&typeof p.name==='string').map(p=>({...p,id:uid('project'),userId:user.id}));const projectMap=new Map();payload.projects.filter(p=>p&&typeof p.name==='string').forEach((old,i)=>{if(newProjects[i])projectMap.set(old.id,newProjects[i].id)});const newReminders=payload.reminders.filter(r=>r&&typeof r.title==='string').map(r=>({...r,id:uid('reminder'),userId:user.id,projectId:projectMap.get(r.projectId)||null,status:r.status==='done'?'done':'active'}));const settings={userId:user.id,autoBackupIntervalMs:Number(payload.settings?.autoBackupIntervalMs||0),autoBackupStartedAt:Number(payload.settings?.autoBackupIntervalMs||0)?new Date().toISOString():null,theme:payload.settings?.theme||'mint',updatedAt:new Date().toISOString()};await new Promise((resolve,reject)=>{const transaction=state.db.transaction(['users','projects','reminders','settings'],'readwrite');transaction.objectStore('users').put(user);for(const project of newProjects)transaction.objectStore('projects').put(project);for(const reminder of newReminders)transaction.objectStore('reminders').put(reminder);transaction.objectStore('settings').put(settings);transaction.oncomplete=resolve;transaction.onerror=()=>reject(transaction.error);transaction.onabort=()=>reject(transaction.error)});state.activeUser=user;state.lockedUser=null;state.activePin=pin;rememberUserId(user.id);await reloadUsers();await reloadWorkspace();applyTheme(settings.theme);state.view='home';state.selectedProjectId=null;state.pendingImportFile=null;closeModal();render();startBackupScheduler();startIdleLockTimer();await maybeAutoBackup();toast(`已从备份恢复「${name}」。`)}
function performAction(target){const action=target.dataset.action,id=target.dataset.id;if(!action)return;if(action==='close-modal')return closeModal();if(action==='new-user'){closeModal();renderUserCreationModal();return}if(action==='select-user'){state.view='home';render();return}if(action==='switch-user')return activateUser(id);if(action==='theme-settings')return themeSettingsModal();if(action==='set-theme')return saveTheme(target.dataset.theme);if(action==='delete-user')return deleteUserEntireProfile(id);if(action==='change-pin')return changePinModal(id);if(action==='cancel-unlock'){state.lockedUser=null;state.activeUser=null;state.activePin=null;state.view='home';closeModal();render();return}if(action==='lock-now'){closeModal();return lockCurrentUser('已手动锁屏。')}if(action==='import')return $('importFile').click();if(['create-project','edit-project','delete-project','create-reminder','edit-reminder','delete-reminder','toggle-reminder','export','save-backup-settings','backup-now','download-backup'].includes(action)&&!state.activeUser){toast('请先解锁本地账户。');return}if(action==='create-project')return projectModal();if(action==='edit-project')return projectModal(projectFor(id));if(action==='delete-project')return deleteProject(id);if(action==='open-project'){state.selectedProjectId=id;state.view='projects';render();return}if(action==='close-project-detail'){state.selectedProjectId=null;state.view='projects';render();return}if(action==='create-reminder')return reminderModal(null,target.dataset.projectId||null);if(action==='edit-reminder')return reminderModal(state.reminders.find(r=>r.id===id));if(action==='delete-reminder')return deleteReminder(id);if(action==='toggle-reminder')return toggleReminder(id);if(action==='filter-reminders'){state.reminderFilter=target.dataset.filter||'active';render();return}if(action==='calendar-prev'){state.calendarCursor=new Date(state.calendarCursor.getFullYear(),state.calendarCursor.getMonth()-1,1);render();return}if(action==='calendar-next function bindEvents(){document.addEventListener('click',event=>{const actionTarget=event.target.closest('[data-action]');if(actionTarget){event.preventDefault();Promise.resolve(performAction(actionTarget)).catch(error=>toast(error.message||'操作失败'));return}const nav=event.target.closest('[data-view]');if(nav){event.preventDefault();if(!state.activeUser){state.view=nav.dataset.view;render();return}state.view=nav.dataset.view;state.selectedProjectId=null;render();return}const choice=event.target.closest('[data-user-id]');if(choice){requestUnlockUser(choice.dataset.userId);return}});$('userSwitch').addEventListener('click',()=>{if(state.lockedUser&&!state.activeUser){toast('请先解锁后再管理本地账户。');return}if(!state.users.length){state.view='home';render();return}switchUserModal()});$('modalOverlay').addEventListener('click',event=>{if(event.target===$('modalOverlay'))closeModal()});document.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.lockedUser&&!state.activeUser)return; if(event.key==='Escape')closeModal()});document.addEventListener('submit',async event=>{const form=event.target;if(form.id==='firstUserForm'){event.preventDefault();try{const pin=$('firstUserPin').value;if(pin!==$('firstUserPinConfirm').value)throw new Error('两次 PIN 输入不一致。');const avatar=await imageFileToAvatar($('firstUserAvatarFile').files?.[0])||$('firstUserAvatar').value;await createUser($('firstUserName').value,avatar,pin)}catch(error){toast(`创建失败：${error.message}`)}return}if(form.id==='newUserForm'){event.preventDefault();try{const pin=$('newUserPin').value;if(pin!==$('newUserPinConfirm').value)throw new Error('两次 PIN 输入不一致。');const avatar=await imageFileToAvatar($('newUserAvatarFile').files?.[0])||$('newUserAvatar').value;await createUser($('newUserName').value,avatar,pin)}catch(error){toast(`创建用户失败：${error.message}`)}return}if(form.id==='pinUnlockForm'){event.preventDefault();try{await unlockLockedUser($('unlockPin').value)}catch(error){toast(error.message||'解锁失败');$('unlockPin')?.select()}return}if(form.id==='pinSetupForm'){event.preventDefault();try{const pin=$('setupPin').value;if(pin!==$('setupPinConfirm').value)throw new Error('两次 PIN 输入不一致。');await unlockLockedUser(pin,pin)}catch(error){toast(error.message||'设置 PIN 失败');$('setupPin')?.select()}return}if(form.id==='importPinForm'){event.preventDefault();try{await completeEncryptedImport($('importPin').value)}catch(error){toast(error.message||'验证或恢复失败');$('importPin')?.select()}return}if(form.id==='changePinForm'){event.preventDefault();try{const user=state.users.find(u=>u.id===form.dataset.id);if(!user)throw new Error('找不到本地用户。');if(user.pinHash){if(!validPin($('oldPin').value))throw new Error('当前 PIN 必须是 4 位数字。');if(!await verifyUserPin(user,$('oldPin').value))throw new Error('当前 PIN 不正确。')}const pin=$('changeNewPin').value;if(!validPin(pin))throw new Error('新 PIN 必须是 4 位数字。');if(pin!==$('changeNewPin2').value)throw new Error('两次新 PIN 输入不一致。');const updated={...user,...await createPinCredentials(pin),updatedAt:new Date().toISOString()};await put('users',updated);await reloadUsers();if(state.activeUser?.id===user.id){state.activeUser=updated;state.activePin=pin}if(state.lockedUser?.id===user.id)state.lockedUser=updated;closeModal();render();switchUserModal();toast('PIN 已修改。旧备份仍需使用导出时的 PIN。')}catch(error){toast(error.message||'修改 PIN 失败')}return}if(form.id==='projectForm'){try{await saveProject(event)}catch(error){toast(`保存项目失败：${error.message||'未知错误'}`)}return}if(form.id==='reminderForm'){try{await saveReminder(event)}catch(error){toast(`保存提醒失败：${error.message||'未知错误'}`)}return}});document.addEventListener('change',event=>{if(event.target.id==='reminderProjectFilter'){state.reminderProjectFilter=event.target.value;render();return}if(event.target.matches('[data-avatar-user]')){const file=event.target.files?.[0];if(file)updateUserAvatar(event.target.dataset.avatarUser,file);event.target.value='';return}});$('importFile').addEventListener('change',event=>{const file=event.target.files?.[0];i
